<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>RUNΔX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a0e;--fg:#e8eaf0;--red:#ff3232;--gold:#ffcc00;
  --dim:#1a2030;--glow:rgba(255,50,50,0.4);
  --mono:'Share Tech Mono',monospace;--display:'Bebas Neue',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);
  font-family:var(--mono);overflow:hidden;touch-action:none;user-select:none;}
#c{display:block;width:100%;height:100%;position:fixed;top:0;left:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:12px 20px;pointer-events:none;z-index:10;}
.hg{display:flex;flex-direction:column;gap:1px}
.hg.r{align-items:flex-end}
.hl{font-size:8px;letter-spacing:3px;color:var(--red);opacity:.65;transition:color .4s,opacity .4s;}
.hv{font-family:var(--display);font-size:34px;letter-spacing:2px;color:var(--fg);
  line-height:1;text-shadow:0 0 20px var(--glow);transition:color .4s,text-shadow .4s;}
body.cw .hl{color:#ffaa00;opacity:.9;} body.cw .hv{color:#ffcc44;text-shadow:0 0 24px rgba(255,170,0,.5);}
body.ca .hl{color:var(--red);opacity:1;} body.ca .hv{color:#ff6060;text-shadow:0 0 28px rgba(255,0,0,.7);}
body.cc .hl{color:#44ff88;opacity:.8;}

/* Screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:20;background:rgba(6,10,14,.9);opacity:0;pointer-events:none;
  transition:opacity .22s;backdrop-filter:blur(6px);}
.screen.on{opacity:1;pointer-events:all}
.si{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:20px}
.logo{font-family:var(--display);font-size:clamp(70px,13vw,120px);letter-spacing:6px;
  color:var(--fg);text-shadow:0 0 30px var(--glow),0 0 80px var(--glow);animation:flicker 5s infinite;}
.logo span{color:var(--red);text-shadow:0 0 40px var(--glow),0 0 90px var(--glow)}
.sub{font-size:10px;letter-spacing:4px;color:var(--red);opacity:.6}
.hint{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;
  color:var(--fg);opacity:.55;animation:pulse 2s ease-in-out infinite;}
.key{border:1.5px solid rgba(232,234,240,.35);padding:4px 11px;font-size:10px;letter-spacing:2px;border-radius:3px}
.warn{font-size:9px;letter-spacing:3px;color:var(--red);opacity:.35}
.dead-title{font-family:var(--display);font-size:clamp(56px,11vw,100px);letter-spacing:8px;
  color:var(--red);text-shadow:0 0 40px var(--glow),0 0 100px var(--glow);animation:shakein .4s ease;}
.stats{display:flex;flex-direction:column;gap:8px;width:260px;
  border-top:1px solid var(--dim);border-bottom:1px solid var(--dim);padding:14px 0;}
.sr{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px}
.sn{color:var(--fg);opacity:.4} .sv{color:var(--gold);text-shadow:0 0 10px rgba(255,204,0,.3)}
.sv.red{color:#ff6060;text-shadow:0 0 10px rgba(255,50,50,.4);}
.taunt{font-size:10px;letter-spacing:2px;color:var(--fg);opacity:.45;max-width:280px;font-style:italic}
.pt{font-family:var(--display);font-size:68px;letter-spacing:8px;opacity:.8}
.ph{font-size:12px;letter-spacing:2px;opacity:.45}

@keyframes flicker{0%,90%,94%,100%{opacity:1}91%,93%{opacity:.5}92%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.22}}
@keyframes shakein{0%{transform:translateX(0)}20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}100%{transform:translateX(0)}}
@media(max-width:480px){.hv{font-size:26px;}.logo{font-size:72px;}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hg"><span class="hl">DIST</span><span class="hv" id="hv-s">0</span></div>
  <div class="hg r"><span class="hl">BEST</span><span class="hv" id="hv-b">0</span></div>
</div>

<div id="s-menu" class="screen on">
  <div class="si">
    <div><div class="logo">RUN<span>Δ</span>X</div><div class="sub">TRUST NOTHING · SURVIVE EVERYTHING</div></div>
    <div class="hint"><div class="key">SPACE</div><span>or tap to begin</span></div>
    <div class="warn">⚠ THE GAME IS WATCHING YOU ⚠</div>
  </div>
</div>

<div id="s-dead" class="screen">
  <div class="si">
    <div class="dead-title">YOU DIED</div>
    <div class="stats">
      <div class="sr"><span class="sn">DISTANCE</span><span class="sv" id="d-s">0</span></div>
      <div class="sr"><span class="sn">BEST</span><span class="sv" id="d-b">0</span></div>
      <div class="sr"><span class="sn">JUMPS</span><span class="sv" id="d-j">0</span></div>
      <div class="sr"><span class="sn">ACCURACY</span><span class="sv" id="d-a">0%</span></div>
      <div class="sr" id="d-cr" style="display:none">
        <span class="sn">CHAOS SURVIVED</span><span class="sv red" id="d-c">0</span>
      </div>
    </div>
    <div class="taunt" id="d-t">Try again. Maybe you'll get lucky.</div>
    <div class="hint"><div class="key">SPACE</div><span>or tap to retry</span></div>
  </div>
</div>

<div id="s-pause" class="screen">
  <div class="si"><div class="pt">PAUSED</div><div class="ph">Press P or tap to resume</div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  RUNΔX  ·  Definitive single-file build
//  Ground fix · Frustration Engine · Chaos Tiers · Road System
//  Structured obstacle patterns · Death particles · Combo HUD
//  Inverted controls: REMOVED
// ═══════════════════════════════════════════════════════════════════

const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
let W,H;
function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
resize();
window.addEventListener('resize',()=>{ resize(); const gY=H*.72; groundY=gY; Player.setGroundY(gY); Obstacles.setGroundY(gY); });

function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); if(id) document.getElementById(id).classList.add('on'); }
function setChaosClass(cs){ document.body.classList.remove('cw','ca','cc'); if(cs.isWarning) document.body.classList.add('cw'); if(cs.isActive) document.body.classList.add('ca'); if(cs.isCooldown) document.body.classList.add('cc'); }

// ── Audio ──────────────────────────────────────────────────────────
let audioCtx=null;
function initAudio(){ if(audioCtx) return; audioCtx=new(window.AudioContext||window.webkitAudioContext)(); startDrone(); }
function beep(f1,f2,dur,type,vol){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type=type||'square';
  o.frequency.setValueAtTime(f1,audioCtx.currentTime);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+dur*.6);
  g.gain.setValueAtTime(vol||.07,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(1e-4,audioCtx.currentTime+dur);
  o.start(); o.stop(audioCtx.currentTime+dur);
}
const sndJump =()=>beep(220,440,.11,'square',.08);
const sndLand =()=>beep(110,110,.06,'sine',.04);
const sndDeath=()=>beep(300,50,.45,'sawtooth',.14);
function sndChaosWarn(){ if(!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(180,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(60,audioCtx.currentTime+1.8); g.gain.setValueAtTime(0,audioCtx.currentTime); g.gain.linearRampToValueAtTime(.09,audioCtx.currentTime+.3); g.gain.exponentialRampToValueAtTime(1e-4,audioCtx.currentTime+2); o.start(); o.stop(audioCtx.currentTime+2); }
function sndChaosActive(){ if(!audioCtx) return; [140,210,310].forEach((fr,i)=>{ const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.type='square'; o.frequency.value=fr; const t=audioCtx.currentTime+i*.04; g.gain.setValueAtTime(.06,t); g.gain.exponentialRampToValueAtTime(1e-4,t+.35); o.start(t); o.stop(t+.4); }); }
function sndChaosEnd(){ if(!audioCtx) return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.type='sine'; o.frequency.setValueAtTime(80,audioCtx.currentTime); o.frequency.exponentialRampToValueAtTime(240,audioCtx.currentTime+.4); g.gain.setValueAtTime(.08,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-4,audioCtx.currentTime+.5); o.start(); o.stop(audioCtx.currentTime+.5); }
let _rt=0;
function tickRumble(dt,intensity){ if(!audioCtx||intensity<=0) return; _rt-=dt; if(_rt>0) return; _rt=.12+Math.random()*.1; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g);g.connect(audioCtx.destination); o.type='sawtooth'; o.frequency.value=38+Math.random()*30; g.gain.setValueAtTime(.018*intensity,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(1e-4,audioCtx.currentTime+.1); o.start(); o.stop(audioCtx.currentTime+.12); }
let droneN=null,droneG=null;
function startDrone(){ if(!audioCtx||droneN) return; droneN=audioCtx.createOscillator(); droneG=audioCtx.createGain(); droneN.connect(droneG);droneG.connect(audioCtx.destination); droneN.type='sine'; droneN.frequency.value=55; droneG.gain.value=.025; droneN.start(); }

// ── Shake / Flash ──────────────────────────────────────────────────
let shakeAmt=0,shakeDur=0,shakeX=0,shakeY=0,flashA=0,flashC='#ff3232';
function trigShake(a,d){ shakeAmt=a; shakeDur=d||350; }
function trigFlash(c,a){ flashC=c||'#ff3232'; flashA=a||.6; }

// ══════════════════════════════════════════════════════════════════
//  AI SYSTEM  —  Frustration Engine + Chaos State Machine
//  Inverted controls: REMOVED.
//  Chaos tiers (early/mid/late) scale duration and obstacle density.
// ══════════════════════════════════════════════════════════════════
const AI=(()=>{
  const m={ jumpsAttempted:0,jumpsSuccessful:0,deaths:0,survivalTime:0,
            reactionTimes:[],consecutiveSaves:0,chaosCompletions:0 };
  const adj={ speedMul:1,jumpMod:1,gravMod:1,timingBias:0,unpredictability:0,
              betrayalPending:false,betrayalCD:0,repeatCount:0,lastType:null,history:[] };

  // Chaos — phases: 0=IDLE 1=WARNING 2=ACTIVE 3=COOLDOWN
  const PH={IDLE:0,WARNING:1,ACTIVE:2,COOLDOWN:3};
  const ch={ phase:PH.IDLE,timer:0,activeDur:0,cooldownTimer:0,eligibleTimer:0,intensity:0 };

  function reset(){
    m.jumpsAttempted=0;m.jumpsSuccessful=0;m.deaths=0;m.survivalTime=0;
    m.reactionTimes=[];m.consecutiveSaves=0;m.chaosCompletions=0;
    adj.speedMul=1;adj.jumpMod=1;adj.gravMod=1;adj.timingBias=0;adj.unpredictability=0;
    adj.betrayalPending=false;adj.betrayalCD=0;adj.repeatCount=0;adj.lastType=null;adj.history=[];
    ch.phase=PH.IDLE;ch.timer=0;ch.activeDur=0;ch.cooldownTimer=0;ch.eligibleTimer=0;ch.intensity=0;
  }

  function tier(){ const c=m.chaosCompletions; return c===0?'early':c<=2?'mid':'late'; }

  function _condMet(){ return m.survivalTime>=20&&ch.phase===PH.IDLE&&accuracy()>=.75&&m.consecutiveSaves>=3; }

  function _updChaos(dt){
    switch(ch.phase){
      case PH.IDLE:
        _condMet()?(ch.eligibleTimer+=dt):(ch.eligibleTimer=Math.max(0,ch.eligibleTimer-dt*.5));
        if(ch.eligibleTimer>=2){ch.eligibleTimer=0;ch.phase=PH.WARNING;ch.timer=2;}
        ch.intensity=Math.max(0,ch.intensity-dt*1.5);
        break;
      case PH.WARNING:
        ch.timer-=dt; ch.intensity=Math.min(1,1-ch.timer/2);
        if(ch.timer<=0){
          const t=tier(), mn=t==='late'?6:t==='mid'?5:3, mx=t==='late'?8:t==='mid'?6:5;
          ch.activeDur=mn+Math.random()*(mx-mn); ch.phase=PH.ACTIVE; ch.timer=ch.activeDur; ch.intensity=1;
        }
        break;
      case PH.ACTIVE:
        ch.timer-=dt; ch.intensity=1;
        if(ch.timer<=0){ ch.phase=PH.COOLDOWN;ch.cooldownTimer=8;ch.timer=8;m.chaosCompletions++; }
        break;
      case PH.COOLDOWN:
        ch.timer-=dt; ch.intensity=Math.max(0,ch.timer/ch.cooldownTimer);
        if(ch.timer<=0){ ch.phase=PH.IDLE;ch.eligibleTimer=0;ch.intensity=0; }
        break;
    }
  }

  function update(dt){
    m.survivalTime+=dt;
    if(adj.betrayalCD>0) adj.betrayalCD-=dt;
    // Speed ramp
    const t=m.survivalTime,acc=accuracy();
    let spd=Math.min(1+(t/60)*.5+(t/120)*.3,2.8);
    if(acc>.85&&m.jumpsSuccessful>6) spd+=.15;
    if(acc<.55&&m.jumpsAttempted>4){spd*=.92;adj.timingBias=60;}else adj.timingBias=0;
    adj.speedMul+=(spd-adj.speedMul)*.005;
    // Physics drift
    const drift=Math.sin(t*.3)*.07+Math.cos(t*.17)*.04;
    adj.jumpMod=1+drift; adj.gravMod=1-drift*.5;
    if(t>45){const e=(t-45)/150;adj.jumpMod+=(Math.random()-.5)*e*.12;adj.gravMod+=(Math.random()-.5)*e*.08;}
    adj.jumpMod=Math.max(.88,Math.min(1.14,adj.jumpMod));
    adj.gravMod=Math.max(.88,Math.min(1.12,adj.gravMod));
    adj.unpredictability=Math.min(1,Math.max(0,(t-30)/80));
    _updChaos(dt);
  }

  function getChaos(){
    return{ phase:ch.phase,isWarning:ch.phase===PH.WARNING,isActive:ch.phase===PH.ACTIVE,
            isCooldown:ch.phase===PH.COOLDOWN,intensity:ch.intensity,timer:ch.timer,
            activeDuration:ch.activeDur,tier:tier(),completions:m.chaosCompletions,PH };
  }

  function queryNext(){
    const cs=getChaos();
    const tierMul=cs.tier==='late'?3.5:cs.tier==='mid'?2.5:1.5;
    const boost=cs.isActive?tierMul:cs.isWarning?1.3:1;
    const r={betrayal:false,fakeDecoy:false,lastSecTrap:false,speedBurst:false,timingShift:0,chaosPattern:null};
    if(adj.betrayalPending&&adj.betrayalCD<=0){r.betrayal=true;adj.betrayalPending=false;adj.betrayalCD=6;adj.repeatCount=0;}
    if(Math.random()<(.05+adj.unpredictability*.08)*boost) r.fakeDecoy=true;
    if(Math.random()<(.04+(m.survivalTime/120)*.06)*boost)  r.lastSecTrap=true;
    if(m.consecutiveSaves>5&&Math.random()<.25*boost) r.speedBurst=true;
    // Structured pattern during ACTIVE — makes chaos feel intentional
    if(cs.isActive){
      const rv=Math.random();
      if(cs.tier==='early')      r.chaosPattern=rv<.6?'wave':'trick';
      else if(cs.tier==='mid')   r.chaosPattern=rv<.4?'wave':rv<.75?'trick':'gauntlet';
      else                        r.chaosPattern=rv<.25?'wave':rv<.5?'trick':'gauntlet';
    }
    const rng=cs.isActive?(cs.tier==='late'?200:150):100;
    r.timingShift=adj.timingBias+(Math.random()*rng-rng/2);
    return r;
  }

  function recordJump(ts){ m.jumpsAttempted++; if(ts>0){const rv=performance.now()-ts;m.reactionTimes.push(rv);if(m.reactionTimes.length>20)m.reactionTimes.shift();} }
  function recordSuccess(){ m.jumpsSuccessful++;m.consecutiveSaves++;if(m.consecutiveSaves%4===0&&adj.betrayalCD<=0)adj.betrayalPending=true; }
  function recordDeath(){   m.deaths++;m.consecutiveSaves=0; }
  function recordSpawn(type,sp){
    adj.history.push({type,sp});if(adj.history.length>8)adj.history.shift();
    if(adj.history.length>=2){const a=adj.history[adj.history.length-1],b=adj.history[adj.history.length-2];(a.type===b.type&&Math.abs(a.sp-b.sp)<70)?adj.repeatCount++:(adj.repeatCount=0);}
    if(adj.repeatCount>=2&&!adj.betrayalPending&&adj.betrayalCD<=0)adj.betrayalPending=true;
    adj.lastType=type;
  }
  function accuracy(){ return m.jumpsAttempted===0?1:m.jumpsSuccessful/m.jumpsAttempted; }
  function get(){ return{m,adj}; }

  const TAUNTS=["Try again. Maybe you'll get lucky.","The pattern was right there.","Almost. Not quite.",
    "Did you blink?","Your reflexes are… disappointing.","That was preventable.","We adjusted. You didn't.",
    "You were so close it hurts us.","The game isn't cheating. Promise.","We've memorized your mistakes.",
    "Statistically, you should give up.","One more try. That's what they all say.","You hesitated.",
    "Your brain is slower than expected.","You felt that pattern? We deleted it.",
    "The road moved. You didn't notice.","Chaos warned you. You ignored it."];
  function taunt(){ return TAUNTS[Math.floor(Math.random()*TAUNTS.length)]; }

  return{reset,update,recordJump,recordSuccess,recordDeath,recordSpawn,queryNext,accuracy,get,getChaos,taunt};
})();

// ══════════════════════════════════════════════════════════════════
//  PLAYER  —  No inverted controls. Death particles added.
// ══════════════════════════════════════════════════════════════════
const Player=(()=>{
  const BJV=-620,BGV=1800,SW=26,SH=28;
  let px,py,vy,onGround,alive,groundY;
  let trail=[],deathT=0,landSq=1,jumpSt=1,tilt=0,obsTs=0;
  let sparks=[];  // death particles

  function _spawnSparks(x,y){
    sparks=[];
    for(let i=0;i<22;i++){
      const angle=(Math.PI*2*i)/22+(Math.random()-.5)*.4;
      const spd=80+Math.random()*200;
      sparks.push({x,y:y-SH/2,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd-60,
        size:2+Math.random()*4,alpha:.9+Math.random()*.1,hue:Math.random()<.7?0:20+Math.random()*20});
    }
  }

  function init(gY){
    groundY=gY;px=W*.18;py=gY;vy=0;onGround=true;alive=true;
    trail=[];deathT=0;landSq=1;jumpSt=1;tilt=0;obsTs=0;sparks=[];
  }
  function setObsVis(ts){ obsTs=ts; }
  function setGroundY(gY){ const was=onGround; groundY=gY; if(was){py=groundY;vy=0;} }

  function jump(){
    if(!alive||!onGround) return false;
    const{adj}=AI.get(); vy=BJV*adj.jumpMod;
    onGround=false; jumpSt=.65;
    AI.recordJump(obsTs); obsTs=0; sndJump(); return true;
  }

  function die(){
    if(!alive) return;
    alive=false; deathT=1.2;
    _spawnSparks(px,py);
    sndDeath(); trigShake(16,450); trigFlash('#ff3232',.65); AI.recordDeath();
  }

  function update(dt){
    if(!alive){
      deathT=Math.max(0,deathT-dt);
      // Integrate sparks
      sparks.forEach(p=>{ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=400*dt; p.vx*=1-dt*2.5; p.alpha-=dt*1.6; });
      sparks=sparks.filter(p=>p.alpha>0);
      return;
    }
    const{adj}=AI.get();
    vy+=BGV*adj.gravMod*dt; py+=vy*dt;
    // Unconditional hard clamp — never falls through floor
    if(py>=groundY){ const was=!onGround; py=groundY;vy=0;onGround=true; if(was){landSq=.55;sndLand();} }
    else onGround=false;
    landSq+=(1-landSq)*dt*14; jumpSt+=(1-jumpSt)*dt*10;
    const tt=onGround?0:Math.min(.35,vy/2000); tilt+=(tt-tilt)*dt*8;
    trail.unshift({x:px,y:py,a:.55}); if(trail.length>14) trail.pop();
    trail.forEach(p=>{p.a-=dt*2;});
  }

  function draw(){
    // Draw sparks regardless of alive state
    sparks.forEach(p=>{
      if(p.alpha<=0) return;
      ctx.save(); ctx.globalAlpha=Math.max(0,p.alpha);
      ctx.shadowColor=`hsl(${p.hue},100%,60%)`; ctx.shadowBlur=8;
      ctx.fillStyle=`hsl(${p.hue},100%,65%)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    if(!alive&&deathT<=0) return;
    const alpha=alive?1:Math.min(1,deathT/.3);

    // Trail
    trail.forEach((p,i)=>{
      const ta=Math.max(0,p.a)*alpha*.5; if(ta<=0) return;
      ctx.save(); ctx.globalAlpha=ta; ctx.fillStyle='#ff3232';
      const sc=1-(i/trail.length)*.6;
      ctx.fillRect(p.x-SW*sc*.35,p.y-SH*sc*.7,SW*sc*.7,SH*sc*.7);
      ctx.restore();
    });

    ctx.save(); ctx.globalAlpha=alpha;
    ctx.translate(px,py); ctx.rotate(tilt);
    const sw=SW*(onGround?landSq+(1-landSq):jumpSt);
    const sh=SH/(onGround?landSq+(1-landSq):jumpSt);
    // Shadow
    ctx.globalAlpha=alpha*.25; ctx.fillStyle='#ff3232';
    ctx.beginPath(); ctx.ellipse(0,4,sw*.7,5,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=alpha;
    // Body
    const g=ctx.createLinearGradient(-sw/2,-sh,sw/2,0);
    g.addColorStop(0,'#ff6060'); g.addColorStop(1,'#cc1010');
    ctx.fillStyle=g; ctx.shadowColor='#ff3232'; ctx.shadowBlur=18;
    _rr(ctx,-sw/2,-sh,sw,sh,4); ctx.fill();
    // Eye
    ctx.shadowBlur=8;ctx.shadowColor='#fff';ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sw*.18,-sh*.72,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#080c10';ctx.beginPath();ctx.arc(sw*.22,-sh*.70,1.8,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0; ctx.restore();
  }

  function _rr(ctx,x,y,w,h,r){
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
  }
  function bounds(){ const m=4; return{x:px-SW/2+m,y:py-SH,w:SW-m*2,h:SH-2}; }
  function getPos(){ return{x:px,y:py}; }
  function isAlive(){ return alive; }
  return{init,jump,die,update,draw,bounds,getPos,isAlive,setObsVis,setGroundY};
})();

// ══════════════════════════════════════════════════════════════════
//  OBSTACLES  —  Structured chaos patterns: wave / trick / gauntlet
// ══════════════════════════════════════════════════════════════════
const Obstacles=(()=>{
  let pool=[],scrollX=0,nextX=0,groundY=0,pendingTrap=false;
  let cSeqType=null,cSeqIdx=0;
  const SEQ_LEN=3;

  function init(gY){ pool=[];scrollX=0;groundY=gY;nextX=W+220;pendingTrap=false;cSeqType=null;cSeqIdx=0; }
  function setGroundY(gY){ groundY=gY; }

  function update(dt,spd){
    const dx=spd*dt; scrollX+=dx;
    pool.forEach(o=>{o.sx-=dx;});
    pool=pool.filter(o=>o.sx+o.w+60>0);
    while(nextX-scrollX<W+450) _spawn();
    if(pendingTrap){_trap();pendingTrap=false;}
  }

  function _spawn(){
    const q=AI.queryNext(),{adj}=AI.get(),s=adj.speedMul;
    const TYPES=['spike','tall','double','hang','decoy'];
    let type;
    if(q.betrayal){
      const ot=TYPES.filter(t=>t!==adj.lastType&&t!=='decoy');
      type=ot[Math.floor(Math.random()*ot.length)];
    } else if(q.fakeDecoy) type='decoy';
    else if(q.chaosPattern) type=_chaosType(q.chaosPattern,adj.unpredictability);
    else type=_normalType(adj.unpredictability);

    const bsp={spike:340,tall:400,double:310,hang:470,decoy:360};
    let sp=(bsp[type]||360)/s;
    if(q.chaosPattern==='gauntlet') sp*=.82;  // tighten gauntlet spacing
    sp+=q.timingShift*s*.001;
    sp=Math.max(200,sp);  // hard min — always survivable

    pool.push(_make(type,nextX-scrollX));
    AI.recordSpawn(type,sp);
    nextX+=sp;
    if(q.lastSecTrap) pendingTrap=true;
  }

  // Normal weighted selection
  function _normalType(u){
    const r=Math.random();
    if(r<.35-u*.1) return 'spike';
    if(r<.52-u*.05) return 'double';
    if(r<.66+u*.08) return 'tall';
    if(r<.78+u*.10) return 'hang';
    return 'spike';
  }

  // Structured chaos sequences — intentional challenge runs, not noise
  // wave=spike·double·spike  trick=decoy·spike·tall  gauntlet=tall·double·double
  function _chaosType(pat,u){
    if(cSeqType!==pat||cSeqIdx>=SEQ_LEN){ cSeqType=pat; cSeqIdx=0; }
    const pos=cSeqIdx++;
    switch(pat){
      case 'wave':     return pos===1?'double':'spike';
      case 'trick':    return pos===0?'decoy':pos===1?'spike':'tall';
      case 'gauntlet': return pos===0?'tall':'double';
      default:         return _normalType(u);
    }
  }

  function _make(type,sx){
    const safe=type==='decoy',base={type,sx,safe,visTs:0,cleared:false};
    switch(type){
      case 'spike':  return{...base,w:28,h:44,color:'#ff3232',glow:'#ff3232',shape:'spike'};
      case 'tall':   return{...base,w:22,h:64,color:'#ff6200',glow:'#ff6200',shape:'rect'};
      case 'double': return{...base,w:28,h:44,color:'#ff3232',glow:'#ff3232',shape:'spike',twin:true,twinOff:44};
      case 'hang':   return{...base,w:58,h:18,color:'#cc00ff',glow:'#cc22ff',shape:'hang',ceiling:true};
      case 'decoy':  return{...base,w:28,h:44,color:'#2a7a3b',glow:'#00ff88',shape:'spike',safe:true};
      default:       return{...base,w:28,h:44,color:'#ff3232',glow:'#ff3232',shape:'spike'};
    }
  }

  function _trap(){
    const p=Player.getPos();
    pool.push({type:'spike',sx:p.x+90+Math.random()*40,w:20,h:32,
      color:'#ff3232',glow:'#ff3232',shape:'spike',safe:false,visTs:performance.now(),cleared:false});
  }

  function check(pb){
    for(const o of pool){
      if(o.cleared||o.safe) continue;
      if(!o.visTs&&o.sx<W+60){o.visTs=performance.now();Player.setObsVis(o.visTs);}
      if(o.ceiling&&_ov(pb,{x:o.sx,y:groundY-110-o.h,w:o.w,h:o.h})) return o;
      if(!o.ceiling&&_ov(pb,{x:o.sx,y:groundY-o.h,w:o.w,h:o.h})) return o;
      if(o.twin&&_ov(pb,{x:o.sx+o.twinOff,y:groundY-o.h,w:o.w,h:o.h})) return o;
      if(o.sx+o.w<pb.x&&!o.cleared){o.cleared=true;AI.recordSuccess();}
    }
    return null;
  }
  function _ov(a,b){ return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y; }

  function draw(){ pool.forEach(_drawOb); }
  function _drawOb(o){
    ctx.save();ctx.shadowColor=o.glow;ctx.shadowBlur=16;
    if(o.shape==='spike'){
      _spk(o.sx,groundY,o.w,o.h,o.color);
      if(o.twin) _spk(o.sx+o.twinOff,groundY,o.w,o.h,o.color);
    }else if(o.shape==='rect'){
      ctx.fillStyle=o.color; ctx.fillRect(o.sx,groundY-o.h,o.w,o.h);
      ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
      for(let yy=groundY-o.h;yy<groundY;yy+=10){ctx.beginPath();ctx.moveTo(o.sx,yy);ctx.lineTo(o.sx+o.w,yy);ctx.stroke();}
    }else if(o.shape==='hang'){
      const hy=groundY-110; ctx.fillStyle=o.color; ctx.fillRect(o.sx,hy,o.w,o.h);
      ctx.shadowBlur=8;
      for(let i=0;i<3;i++){const dx2=o.sx+(o.w/4)*(i+.5);ctx.beginPath();ctx.moveTo(dx2-4,hy+o.h);ctx.lineTo(dx2+4,hy+o.h);ctx.lineTo(dx2,hy+o.h+14);ctx.closePath();ctx.fill();}
    }
    ctx.restore();
  }
  function _spk(sx,sy,w,h,col){
    ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(sx,sy);ctx.lineTo(sx+w,sy);ctx.lineTo(sx+w/2,sy-h);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)'; ctx.beginPath(); ctx.moveTo(sx+w*.3,sy-2);ctx.lineTo(sx+w*.5,sy-h*.75);ctx.lineTo(sx+w*.5,sy-2);ctx.closePath();ctx.fill();
  }

  return{init,update,draw,check,setGroundY};
})();

// ══════════════════════════════════════════════════════════════════
//  ROAD SYSTEM  —  Purely visual perspective bend during chaos
//  groundY (physics floor) is NEVER modified.
// ══════════════════════════════════════════════════════════════════
const Road=(()=>{
  let vOff=0,vTgt=0,bend=0,bTgt=0,narrow=1,nTgt=1,phV=0,phH=0;

  function reset(){ vOff=0;vTgt=0;bend=0;bTgt=0;narrow=1;nTgt=1;phV=0;phH=0; }

  function update(dt,cs){
    const tierMul=cs.tier==='late'?1:cs.tier==='mid'?.65:.35;
    const ws=cs.intensity*tierMul;
    const vF=cs.isActive?(cs.tier==='late'?.55:.4):.25;
    const hF=cs.isActive?(cs.tier==='late'?.35:.25):.15;
    phV+=dt*vF*Math.PI*2; phH+=dt*hF*Math.PI*2;

    if(ws<.01){ vTgt=0;bTgt=0;nTgt=1; }
    else{
      vTgt=Math.sin(phV)*38*ws;
      bTgt=Math.sin(phH)*.06*ws;
      nTgt=1-(.45*ws)*(1-(.5+.5*Math.cos(phV*.7)));
    }
    const lr=2.8;
    vOff+=(vTgt-vOff)*Math.min(1,dt*lr);
    bend+=(bTgt-bend) *Math.min(1,dt*lr*.7);
    narrow+=(nTgt-narrow)*Math.min(1,dt*lr*1.2);
  }

  function draw(gY,cs,worldX){
    if(cs.intensity<.02) return;
    const roadCY=gY+vOff, bandH=16+narrow*8;
    ctx.save();
    // Road band
    ctx.globalAlpha=Math.min(.85,cs.intensity*.9);
    const rg=ctx.createLinearGradient(0,roadCY-bandH,0,roadCY+6);
    const rc=cs.isActive?'rgba(60,0,0,':'rgba(40,20,0,';
    rg.addColorStop(0,rc+'0)');rg.addColorStop(.5,rc+'.5)');rg.addColorStop(1,rc+'0)');
    ctx.fillStyle=rg; ctx.fillRect(0,roadCY-bandH,W,bandH+6);
    // Perspective lane lines
    const vpX=W/2+bend*W*3, vpY=roadCY-H*.35;
    const lhW=W*.48*narrow;
    const eY=roadCY+2, lL=W/2-lhW, lR=W/2+lhW;
    ctx.globalAlpha=Math.min(.7,cs.intensity*.75);
    ctx.strokeStyle=cs.isActive?'#550000':'#552200'; ctx.lineWidth=1.5;
    ctx.shadowColor=cs.isActive?'#ff2200':'#ff8800'; ctx.shadowBlur=6;
    ctx.beginPath();ctx.moveTo(lL,eY);ctx.lineTo(vpX,vpY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(lR,eY);ctx.lineTo(vpX,vpY);ctx.stroke();
    // Animated dashed centre
    ctx.shadowBlur=3; ctx.strokeStyle=cs.isActive?'#880000':'#663300'; ctx.lineWidth=1;
    const dOff=(worldX*.9)%50;
    ctx.setLineDash([20,30]); ctx.lineDashOffset=-dOff;
    ctx.beginPath();ctx.moveTo(W/2-lhW*.05,eY);ctx.lineTo(vpX,vpY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W/2+lhW*.05,eY);ctx.lineTo(vpX,vpY);ctx.stroke();
    ctx.setLineDash([]); ctx.shadowBlur=0; ctx.globalAlpha=1; ctx.restore();
  }
  return{reset,update,draw};
})();

// ══════════════════════════════════════════════════════════════════
//  WORLD (background buildings)
// ══════════════════════════════════════════════════════════════════
let bgB=[],worldX=0;
function genBuildings(){
  bgB=[];
  for(let i=0;i<28;i++){
    const L=Math.floor(Math.random()*3);
    bgB.push({x:(W/28)*i+(Math.random()*40-20),
      w:8+Math.random()*(L===0?40:L===1?22:12),
      h:L===0?40+Math.random()*90:L===1?25+Math.random()*55:8+Math.random()*28,
      L,speed:[.05,.15,.35][L],alpha:[.045,.065,.09][L]});
  }
}

function lerpC(hexA,hexB,t){
  const p=h=>{const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];};
  const a=p(hexA),b=p(hexB);
  return`rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;
}

function drawBg(gY,cs){
  const dk=cs.intensity*.85;
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0, lerpC('#030508','#000000',dk));
  sg.addColorStop(.55,lerpC('#060a0e','#010103',dk));
  sg.addColorStop(1,  lerpC('#090d14','#020205',dk));
  ctx.fillStyle=sg; ctx.fillRect(0,0,W,H);
  // Stars (dim with chaos)
  ctx.fillStyle=`rgba(200,210,255,${.45*(1-cs.intensity*.7)})`;
  for(let i=0;i<60;i++){ const sx=((i*137.508+worldX*.01)%W+W)%W,sy=((i*73.2)%(gY*.8)); ctx.fillRect(sx,sy,1,1); }
  // Buildings
  bgB.forEach(b=>{
    const bx=((b.x-worldX*b.speed)%W+W)%W;
    ctx.globalAlpha=b.alpha*(1-cs.intensity*.5);
    ctx.fillStyle=b.L===0?'#18222e':b.L===1?'#101820':'#0c1018';
    ctx.fillRect(bx,gY-b.h,b.w,b.h);
    if(b.L===0&&b.h>45){
      ctx.fillStyle='rgba(255,195,60,.35)';
      for(let wy=gY-b.h+6;wy<gY-6;wy+=10)
        for(let wx=bx+3;wx<bx+b.w-3;wx+=6)
          if(Math.sin(wx*wy*.01+worldX*.001)>.3) ctx.fillRect(wx,wy,3,4);
    }
    ctx.globalAlpha=1;
  });
}

function drawGround(gY,cs){
  const gg=ctx.createLinearGradient(0,gY,0,H);
  gg.addColorStop(0,'#0e1520');gg.addColorStop(.5,'#070c12');gg.addColorStop(1,'#040609');
  ctx.fillStyle=gg; ctx.fillRect(0,gY,W,H-gY);
  const lc=cs.isActive?'#ff8800':cs.isWarning?'#cc6600':'#ff3232';
  ctx.shadowColor=lc;ctx.shadowBlur=10;ctx.strokeStyle=lc;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,gY);ctx.lineTo(W,gY);ctx.stroke();ctx.shadowBlur=0;
  const spd=AI.get().adj.speedMul,dashW=22,gap=55/spd,off=(worldX*.8)%(dashW+gap);
  ctx.strokeStyle=`rgba(255,${cs.isActive?130:50},50,.22)`;ctx.lineWidth=1;
  ctx.setLineDash([dashW,gap]);ctx.lineDashOffset=-off;
  ctx.beginPath();ctx.moveTo(0,gY+6);ctx.lineTo(W,gY+6);ctx.stroke();ctx.setLineDash([]);
}

// ══════════════════════════════════════════════════════════════════
//  CHAOS VISUALS
// ══════════════════════════════════════════════════════════════════
let glitch=[];
function updGlitch(dt,cs){
  if(!cs.isWarning&&!cs.isActive){glitch=[];return;}
  for(let i=0;i<Math.floor(cs.intensity*3);i++)
    if(Math.random()<.25*cs.intensity)
      glitch.push({y:Math.random()*H,w:30+Math.random()*W*.4,dx:(Math.random()-.5)*60*cs.intensity,
        alpha:.3+Math.random()*.4*cs.intensity,life:.05+Math.random()*.12});
  glitch=glitch.map(l=>({...l,life:l.life-dt,alpha:l.alpha-dt*2})).filter(l=>l.life>0&&l.alpha>0);
  if(glitch.length>18) glitch.splice(0,glitch.length-18);
}

function drawChaosLayers(cs){
  if(cs.intensity<=0) return;
  // Vignette
  const r=cs.isActive?80:50,gv=cs.isActive?0:10;
  const cv=ctx.createRadialGradient(W/2,H/2,H*.15,W/2,H/2,H*.85);
  cv.addColorStop(0,'rgba(0,0,0,0)');cv.addColorStop(.6,'rgba(0,0,0,0)');
  cv.addColorStop(1,`rgba(${r},${gv},0,${cs.intensity*.7})`);
  ctx.fillStyle=cv;ctx.fillRect(0,0,W,H);
  const pulse=Math.sin(Date.now()/200)*.15+.15;
  const fA=cs.intensity*(.25+(cs.isActive?pulse:0));
  ctx.strokeStyle=cs.isActive?`rgba(180,0,0,${fA})`:`rgba(120,60,0,${fA*.7})`;
  ctx.lineWidth=8+cs.intensity*12;ctx.strokeRect(0,0,W,H);
  // Scan-tears
  if(glitch.length){
    ctx.save();
    glitch.forEach(l=>{
      ctx.globalAlpha=Math.max(0,l.alpha)*cs.intensity;
      const lh=2+Math.random()*4;
      try{const id=ctx.getImageData(0,l.y,W,lh);ctx.putImageData(id,l.dx,l.y);}catch(e){}
      ctx.fillStyle=cs.isActive?`rgba(255,0,0,${l.alpha*.3*cs.intensity})`:`rgba(255,140,0,${l.alpha*.3*cs.intensity})`;
      ctx.fillRect(l.dx,l.y,l.w,lh);
    });
    ctx.globalAlpha=1;ctx.restore();
  }
  // Chromatic aberration
  if(cs.intensity>.2){
    const off=Math.round(cs.intensity*6);
    ctx.save();ctx.globalAlpha=cs.intensity*.10;ctx.globalCompositeOperation='screen';
    ctx.fillStyle='rgb(255,0,0)';ctx.fillRect(-off,0,W,H);
    ctx.fillStyle='rgb(0,0,255)';ctx.fillRect(off,0,W,H);
    ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.restore();
  }
}

function drawChaosBadge(cs){
  if(cs.intensity<=.05) return;
  ctx.save(); const bY=56,cx2=W/2,now=Date.now();
  if(cs.isWarning){
    const pulse=Math.abs(Math.sin(now/200));
    ctx.globalAlpha=.5+pulse*.5; ctx.font=`bold 13px 'Share Tech Mono',monospace`; ctx.textAlign='center';
    ctx.fillStyle='#ffaa00';ctx.shadowColor='#ffaa00';ctx.shadowBlur=18;
    ctx.fillText('⚠  CHAOS INCOMING  ⚠',cx2,bY);
    ctx.font=`10px 'Share Tech Mono',monospace`;ctx.globalAlpha=.45+pulse*.3;ctx.fillStyle='#cc8800';ctx.shadowBlur=8;
    ctx.fillText(`[ ${cs.tier.toUpperCase()} ]`,cx2,bY+14);
    const pr=1-cs.timer/2,bw=160,bh=3,bx=cx2-80;
    ctx.globalAlpha=.55;ctx.fillStyle='#2a1800';ctx.fillRect(bx,bY+20,bw,bh);
    ctx.fillStyle='#ffaa00';ctx.shadowBlur=8;ctx.fillRect(bx,bY+20,bw*pr,bh);
  }else if(cs.isActive){
    const fl=Math.sin(now/80)>0?1:.6;
    ctx.globalAlpha=fl;ctx.font=`bold 14px 'Share Tech Mono',monospace`;ctx.textAlign='center';
    ctx.fillStyle='#ff2020';ctx.shadowColor='#ff0000';ctx.shadowBlur=24;
    ctx.fillText('◈  CHAOS ACTIVE  ◈',cx2,bY);
    const pr2=cs.timer/cs.activeDuration,bw=160,bh=3,bx=cx2-80;
    ctx.globalAlpha=.6;ctx.fillStyle='#2a0000';ctx.fillRect(bx,bY+10,bw,bh);
    ctx.fillStyle='#ff2020';ctx.shadowBlur=8;ctx.fillRect(bx,bY+10,bw*pr2,bh);
  }else if(cs.isCooldown){
    ctx.globalAlpha=cs.intensity*.8;ctx.font=`12px 'Share Tech Mono',monospace`;ctx.textAlign='center';
    ctx.fillStyle='#44ff88';ctx.shadowColor='#44ff88';ctx.shadowBlur=14;
    ctx.fillText('CHAOS SURVIVED',cx2,bY);
  }
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
}

function drawComboHUD(){
  const{m}=AI.get(); const saves=m.consecutiveSaves;
  if(saves<3) return;
  const now=Date.now();
  let col,glow;
  if(saves>=12){col='#ff4444';glow='rgba(255,60,60,.6)';}
  else if(saves>=6){col='#ffcc00';glow='rgba(255,200,0,.5)';}
  else{col='#44ff88';glow='rgba(68,255,136,.4)';}
  const pulse=1+Math.sin(now/120)*.06;
  ctx.save();ctx.textAlign='right';ctx.globalAlpha=.82;
  ctx.shadowColor=glow;ctx.shadowBlur=14;
  ctx.font=`bold ${Math.round(11*pulse)}px 'Share Tech Mono',monospace`;
  ctx.fillStyle=col;ctx.fillText('COMBO',W-16,H-42);
  ctx.font=`bold ${Math.round(22*pulse)}px 'Bebas Neue',sans-serif`;
  ctx.fillStyle=col;ctx.fillText(`x${saves}`,W-14,H-22);
  ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.restore();
}

function drawIntensityMeter(adj){
  const iv=adj.unpredictability;if(iv<=.05) return;
  const bw=70,bh=2,bx=W/2-35,by=18;
  ctx.globalAlpha=.35;ctx.fillStyle='#1a2030';ctx.fillRect(bx,by,bw,bh);
  ctx.globalAlpha=.5+iv*.5;ctx.shadowColor='#ff3232';ctx.shadowBlur=5;
  ctx.fillStyle=`rgb(${Math.round(90+iv*165)},${Math.round(40-iv*40)},40)`;
  ctx.fillRect(bx,by,bw*iv,bh);ctx.shadowBlur=0;ctx.globalAlpha=1;
}

const ST={MENU:0,PLAYING:1,DEAD:2,PAUSED:3};
let state=ST.MENU,score=0,bestScore=parseInt(localStorage.getItem('runax_best')||'0',10);
let groundY=0,lastTs=0,rafId=null,prevCP=-1;
const hvS=document.getElementById('hv-s'),hvB=document.getElementById('hv-b');
hvB.textContent=String(bestScore);

function boot(){ groundY=H*.72;genBuildings();Player.init(groundY);Obstacles.init(groundY);AI.reset();Road.reset();score=0;worldX=0;showScreen('s-menu'); }

function startGame(){
  initAudio(); groundY=H*.72; genBuildings();
  Player.init(groundY);Obstacles.init(groundY);AI.reset();Road.reset();
  score=0;worldX=0;prevCP=-1;glitch=[];
  state=ST.PLAYING;showScreen(null);
  if(rafId) cancelAnimationFrame(rafId);
  lastTs=performance.now(); rafId=requestAnimationFrame(loop);
}

function dieFn(){
  state=ST.DEAD;
  if(score>bestScore){bestScore=score;localStorage.setItem('runax_best',String(bestScore));hvB.textContent=String(bestScore);}
  const{m}=AI.get(),acc=Math.round(AI.accuracy()*100);
  document.getElementById('d-s').textContent=String(score);
  document.getElementById('d-b').textContent=String(bestScore);
  document.getElementById('d-j').textContent=String(m.jumpsAttempted);
  document.getElementById('d-a').textContent=acc+'%';
  document.getElementById('d-t').textContent=AI.taunt();
  const cr=document.getElementById('d-cr');
  if(m.chaosCompletions>0){document.getElementById('d-c').textContent=String(m.chaosCompletions);cr.style.display='flex';}
  else cr.style.display='none';
  setChaosClass({isWarning:false,isActive:false,isCooldown:false});
  setTimeout(()=>{if(state===ST.DEAD) showScreen('s-dead');},600);
}

function togglePause(){
  if(state===ST.PLAYING){state=ST.PAUSED;showScreen('s-pause');}
  else if(state===ST.PAUSED){state=ST.PLAYING;showScreen(null);lastTs=performance.now();}
}

function handleInput(){
  initAudio();
  if(state===ST.MENU||state===ST.DEAD){startGame();return;}
  if(state===ST.PAUSED){togglePause();return;}
  if(state===ST.PLAYING) Player.jump();
}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();handleInput();}
  if(e.code==='KeyP'&&(state===ST.PLAYING||state===ST.PAUSED)) togglePause();
});
document.addEventListener('touchstart',e=>{e.preventDefault();handleInput();},{passive:false});

// ══════════════════════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════════════════════
function loop(ts){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;

  if(state===ST.PAUSED){render();return;}

  // Shake decay
  if(shakeDur>0){shakeDur-=dt*1000;const mag=shakeAmt*(shakeDur/350);shakeX=(Math.random()*2-1)*mag;shakeY=(Math.random()*2-1)*mag;}
  else{shakeX=0;shakeY=0;}
  if(flashA>0) flashA-=dt*3;

  if(state===ST.PLAYING){
    const{adj}=AI.get(),speed=280*adj.speedMul;
    worldX+=speed*dt;
    AI.update(dt);Player.update(dt);Obstacles.update(dt,speed);

    // Chaos wiring
    const cs=AI.getChaos();
    if(cs.phase!==prevCP){
      if(cs.isWarning){sndChaosWarn();trigShake(1.5,99999);}
      if(cs.isActive){sndChaosActive();trigFlash('#3b1a1a',.4);}
      if(cs.isCooldown){sndChaosEnd();trigFlash('#1a3b1a',.3);}
      prevCP=cs.phase;
    }
    if(cs.isWarning||cs.isActive){tickRumble(dt,cs.intensity);trigShake(cs.isActive?3.5:1.2*cs.intensity,80);}
    Road.update(dt,cs);
    updGlitch(dt,cs);
    setChaosClass(cs);

    score=Math.floor(worldX/40);hvS.textContent=String(score);
    if(Player.isAlive()){const hit=Obstacles.check(Player.bounds());if(hit){Player.die();setTimeout(dieFn,300);}}
  }
  render();
}

function render(){
  ctx.save();ctx.translate(shakeX,shakeY);
  const cs=AI.getChaos(),{adj}=AI.get();
  drawBg(groundY,cs);
  // Parallax
  ctx.globalAlpha=1;
  // (buildings already drawn in drawBg)
  // Road
  Road.draw(groundY,cs,worldX);
  drawGround(groundY,cs);
  // CRT scanlines
  ctx.globalAlpha=.022;ctx.fillStyle='#000';for(let y=0;y<H;y+=4)ctx.fillRect(0,y,W,2);ctx.globalAlpha=1;
  // Normal vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*.22,W/2,H/2,H);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  // Game objects
  Obstacles.draw();Player.draw();
  // Chaos layers
  drawChaosLayers(cs);
  // HUD elements
  drawIntensityMeter(adj);
  drawComboHUD();
  drawChaosBadge(cs);
  // Flash overlay
  if(flashA>0){ctx.globalAlpha=Math.max(0,flashA);ctx.fillStyle=flashC;ctx.fillRect(-10,-10,W+20,H+20);ctx.globalAlpha=1;}
  ctx.restore();
}

boot();rafId=requestAnimationFrame(loop);
</script>
