<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RUNΔX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="ui-overlay">
    <div id="score-panel">
      <div id="score-label">DIST</div>
      <div id="score-value">0</div>
    </div>
    <div id="best-panel">
      <div id="best-label">BEST</div>
      <div id="best-value">0</div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="screen-start" class="screen active">
    <div class="screen-inner">
      <div class="logo-block">
        <div class="logo-main">RUN<span class="logo-accent">Δ</span>X</div>
        <div class="logo-sub">TRUST NOTHING. SURVIVE EVERYTHING.</div>
      </div>
      <div class="start-hint">
        <span class="key-icon">SPACE</span> or tap to begin
      </div>
      <div class="warning-text">⚠ The game is watching you ⚠</div>
    </div>
  </div>

  <!-- Death Screen -->
  <div id="screen-dead" class="screen">
    <div class="screen-inner">
      <div class="dead-title">YOU DIED</div>
      <div class="dead-stats">
        <div class="stat-row"><span class="stat-name">DISTANCE</span><span id="dead-score" class="stat-val">0</span></div>
        <div class="stat-row"><span class="stat-name">BEST</span><span id="dead-best" class="stat-val">0</span></div>
        <div class="stat-row"><span class="stat-name">JUMPS</span><span id="dead-jumps" class="stat-val">0</span></div>
        <div class="stat-row"><span class="stat-name">ACCURACY</span><span id="dead-acc" class="stat-val">0%</span></div>
        <div id="chaos-row" class="stat-row" style="display:none;">
          <span class="stat-name">CHAOS SURVIVED</span><span id="dead-chaos" class="stat-val chaos-val">0</span>
        </div>
      </div>
      <div id="taunt-line" class="taunt-text">Try again. Maybe you'll get lucky.</div>
      <div class="restart-hint">
        <span class="key-icon">SPACE</span> or tap to retry
      </div>
    </div>
  </div>

  <!-- Pause Screen -->
  <div id="screen-pause" class="screen">
    <div class="screen-inner">
      <div class="pause-title">PAUSED</div>
      <div class="pause-hint">Press P or tap to resume</div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
