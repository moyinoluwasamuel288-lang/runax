<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUNΔX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div id="score-display">
      <span class="label">SCORE</span>
      <span id="score">0</span>
    </div>
    <div id="best-display">
      <span class="label">BEST</span>
      <span id="best">0</span>
    </div>
    <div id="powerup-display" class="hidden">
      <span id="powerup-name"></span>
      <div id="powerup-bar-wrap"><div id="powerup-bar"></div></div>
    </div>
  </div>

  <!-- AI Toggle -->
  <div id="ai-toggle" title="Toggle AI pilot">
    <span id="ai-label">AI OFF</span>
  </div>

  <!-- Start Screen -->
  <div id="overlay" class="screen active">
    <div class="overlay-inner">
      <div class="logo">RUN<span class="delta">Δ</span>X</div>
      <p class="tagline">ENDLESS VELOCITY</p>
      <div class="controls-hint">
        <span>SPACE / TAP → JUMP</span>
      </div>
      <button id="start-btn" class="btn-main">START RUNNING</button>
      <div class="best-row">BEST: <span id="overlay-best">0</span></div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover" class="screen">
    <div class="overlay-inner">
      <div class="go-title">DEAD</div>
      <div class="go-score-wrap">
        <span class="label">SCORE</span>
        <span id="go-score">0</span>
      </div>
      <div class="go-score-wrap">
        <span class="label">BEST</span>
        <span id="go-best">0</span>
      </div>
      <div class="btn-row">
        <button id="restart-btn" class="btn-main">RETRY</button>
        <button id="share-btn" class="btn-secondary">SHARE</button>
      </div>
    </div>
  </div>

  <script type="module" src="engine.js"></script>
</body>
</html>
