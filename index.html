<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUNΔX</title>
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
    </style>
</head>
<body>
    <div class="game-container">
        <header class="hud">
            <div class="logo">RUN<span class="delta">Δ</span>X</div>
            <div class="score-container">
                <div class="score-item">
                    SCORE <span id="score-display" class="value">00000</span>
                </div>
                <div class="score-item">
                    BEST <span id="best-display" class="value">00000</span>
                </div>
            </div>
            <div class="status" id="status">READY</div>
        </header>
        
        <canvas id="game-canvas" width="900" height="500"></canvas>
        
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <div class="overlay-content">
                <h1>RUNΔX</h1>
                <p class="subtitle">ENDLESS RUNNER</p>
                <div class="instructions">
                    <p>PRESS <span class="key">SPACE</span> or <span class="key">TAP</span> to JUMP</p>
                </div>
                <button id="start-button" class="neon-button">START RUN</button>
                <div class="ai-control">
                    <label>
                        <input type="checkbox" id="ai-mode-toggle" checked>
                        ENABLE AI PILOT
                    </label>
                </div>
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay hidden">
            <div class="overlay-content">
                <h2>GAME OVER</h2>
                <div class="score-final">
                    <div>YOUR SCORE</div>
                    <div id="final-score" class="big-number">00000</div>
                </div>
                <div class="score-final">
                    <div>BEST SCORE</div>
                    <div id="final-best" class="big-number">00000</div>
                </div>
                <div class="actions">
                    <button id="restart-button" class="neon-button">RESTART RUN</button>
                    <button id="share-button" class="neon-button secondary">SHARE SCORE</button>
                </div>
                <p id="new-best" class="new-best hidden">NEW BEST!</p>
            </div>
        </div>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
