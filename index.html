<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>RUNΔX</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a0e; --fg:#e8eaf0; --red:#ff3232; --gold:#ffcc00; --dim:#1a2030; --glow:rgba(255,50,50,0.4);
  --mono:'Share Tech Mono',monospace; --display:'Bebas Neue',sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;touch-action:none;user-select:none;}
#c{display:block;width:100%;height:100%;position:fixed;top:0;left:0}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 20px;pointer-events:none;z-index:10;}
.hud-group{display:flex;flex-direction:column;gap:1px}.hud-group.right{align-items:flex-end}
.hud-lbl{font-size:8px;letter-spacing:3px;color:var(--red);opacity:.65}
.hud-val{font-family:var(--display);font-size:34px;letter-spacing:2px;color:var(--fg);line-height:1;text-shadow:0 0 20px var(--glow);}

/* Screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(6,10,14,.9);opacity:0;pointer-events:none;transition:opacity .22s ease;backdrop-filter:blur(6px);}
.screen.on{opacity:1;pointer-events:all}
.si{display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center;padding:20px}

.logo{font-family:var(--display);font-size:clamp(70px,13vw,120px);letter-spacing:6px;color:var(--fg);text-shadow:0 0 30px var(--glow),0 0 80px var(--glow);animation:flicker 5s infinite;}
.logo span{color:var(--red);text-shadow:0 0 40px var(--glow),0 0 90px var(--glow)}
.sub{font-size:10px;letter-spacing:4px;color:var(--red);opacity:.6}

.hint{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:2px;color:var(--fg);opacity:.55;animation:pulse 2s ease-in-out infinite;}
.key{border:1.5px solid rgba(232,234,240,.35);padding:4px 11px;font-size:10px;letter-spacing:2px;border-radius:3px}

.warn{font-size:9px;letter-spacing:3px;color:var(--red);opacity:.35}

.dead-title{font-family:var(--display);font-size:clamp(56px,11vw,100px);letter-spacing:8px;color:var(--red);text-shadow:0 0 40px var(--glow),0 0 100px var(--glow);animation:shakein .4s ease;}
.stats{display:flex;flex-direction:column;gap:8px;width:240px;border-top:1px solid var(--dim);border-bottom:1px solid var(--dim);padding:14px 0;}
.sr{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px}
.sn{color:var(--fg);opacity:.4}.sv{color:var(--gold);text-shadow:0 0 10px rgba(255,204,0,.3)}
.taunt{font-size:10px;letter-spacing:2px;color:var(--fg);opacity:.45;max-width:280px;font-style:italic}

.pause-t{font-family:var(--display);font-size:68px;letter-spacing:8px;opacity:.8}
.pause-h{font-size:12px;letter-spacing:2px;opacity:.45}

@keyframes flicker{0%,90%,94%,100%{opacity:1}91%,93%{opacity:.5}92%{opacity:.15}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.22}}
@keyframes shakein{0%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}100%{transform:translateX(0)}}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div class="hud-group"><span class="hud-lbl">DIST</span><span class="hud-val" id="score-value">0</span></div>
  <div class="hud-group right"><span class="hud-lbl">BEST</span><span class="hud-val" id="best-value">0</span></div>
</div>

<div id="s-menu" class="screen on">
  <div class="si">
    <div><div class="logo">RUN<span>Δ</span>X</div><div class="sub">TRUST NOTHING · SURVIVE EVERYTHING</div></div>
    <div class="hint"><div class="key">SPACE</div><span>or tap to begin</span></div>
    <div class="warn">⚠ THE GAME IS WATCHING YOU ⚠</div>
  </div>
</div>

<div id="s-dead" class="screen">
  <div class="si">
    <div class="dead-title">YOU DIED</div>
    <div class="stats">
      <div class="sr"><span class="sn">DISTANCE</span><span class="sv" id="dead-score">0</span></div>
      <div class="sr"><span class="sn">BEST</span><span class="sv" id="dead-best">0</span></div>
      <div class="sr"><span class="sn">JUMPS</span><span class="sv" id="dead-jumps">0</span></div>
      <div class="sr"><span class="sn">ACCURACY</span><span class="sv" id="dead-acc">0%</span></div>
    </div>
    <div class="taunt" id="taunt-line">Try again. Maybe you'll get lucky.</div>
    <div class="hint"><div class="key">SPACE</div><span>or tap to retry</span></div>
  </div>
</div>

<div id="s-pause" class="screen">
  <div class="si">
    <div class="pause-t">PAUSED</div>
    <div class="pause-h">Press P or tap to resume</div>
  </div>
</div>

<script>
// RUNΔX - Fixed & Working Version (Single File)
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let state = 0; // 0 menu, 1 playing, 2 dead, 3 paused
let score = 0;
let bestScore = parseInt(localStorage.getItem('runax_best') || '0');
let worldScrollX = 0;
let groundY = 0;
let jumpsAttempted = 0;
let jumpsSuccessful = 0;
let survivalTime = 0;
let chaosActive = false;
let jumpInverted = false;
let lastTs = 0;

const elScore = document.getElementById('score-value');
const elBest = document.getElementById('best-value');
const elDeadScore = document.getElementById('dead-score');
const elDeadBest = document.getElementById('dead-best');
const elDeadJumps = document.getElementById('dead-jumps');
const elDeadAcc = document.getElementById('dead-acc');
const elTaunt = document.getElementById('taunt-line');

elBest.textContent = bestScore;

function resetGame() {
  score = 0;
  worldScrollX = 0;
  jumpsAttempted = 0;
  jumpsSuccessful = 0;
  survivalTime = 0;
  chaosActive = false;
  jumpInverted = false;
  elScore.textContent = '0';
}

function startGame() {
  resetGame();
  groundY = H * 0.72;
  state = 1;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  lastTs = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  state = 2;
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem('runax_best', bestScore);
    elBest.textContent = bestScore;
  }
  const accuracy = jumpsAttempted === 0 ? 100 : Math.round((jumpsSuccessful / jumpsAttempted) * 100);

  elDeadScore.textContent = score;
  elDeadBest.textContent = bestScore;
  elDeadJumps.textContent = jumpsAttempted;
  elDeadAcc.textContent = accuracy + '%';
  elTaunt.textContent = chaosActive ? "Chaos got you." : "Try again. Maybe you'll get lucky.";

  setTimeout(() => document.getElementById('s-dead').classList.add('on'), 400);
}

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  if (state !== 1) return;

  survivalTime += dt;

  // Chaos trigger (when doing well)
  if (survivalTime > 35 && Math.random() < 0.012 && !chaosActive) {
    chaosActive = true;
    jumpInverted = true;
    setTimeout(() => {
      chaosActive = false;
      jumpInverted = false;
    }, 4500);
  }

  const speed = 260 + survivalTime * 12;
  worldScrollX += speed * dt;
  score = Math.floor(worldScrollX / 40);

  elScore.textContent = score;

  // Render background
  ctx.fillStyle = chaosActive ? '#1a0a0a' : '#060a0e';
  ctx.fillRect(0, 0, W, H);

  // Ground
  ctx.fillStyle = '#0f1520';
  ctx.fillRect(0, groundY, W, H - groundY);

  // Player
  ctx.save();
  ctx.translate(W * 0.18, groundY - 45);
  ctx.fillStyle = '#ff3b3b';
  ctx.fillRect(-13, -28, 26, 28);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(6, -18, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Obstacles (simple)
  ctx.fillStyle = '#ff3b3b';
  const obsX = W * 0.75 - (worldScrollX % 550);
  ctx.fillRect(obsX, groundY - 55, 32, 55);

  // Chaos effect
  if (chaosActive) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#ff2020';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}

// Input
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    if (state === 0) startGame();
    else if (state === 1) {
      jumpsAttempted++;
      if (!jumpInverted) jumpsSuccessful++;
    }
    else if (state === 2) startGame();
  }
  if (e.code === 'KeyP' && state === 1) {
    state = 3;
    document.getElementById('s-pause').classList.add('on');
  } else if (e.code === 'KeyP' && state === 3) {
    state = 1;
    document.getElementById('s-pause').classList.remove('on');
  }
});

document.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 0) startGame();
  else if (state === 1) {
    jumpsAttempted++;
    if (!jumpInverted) jumpsSuccessful++;
  }
  else if (state === 2) startGame();
});

</script>

</body>
</html>
