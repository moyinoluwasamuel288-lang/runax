<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RUNΔX</title>
<style>
/* ── RUNΔX · style.css ────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');

:root {
  --bg:      #080c10;
  --fg:      #e8eaf0;
  --accent:  #ff3b3b;
  --accent2: #ffcc00;
  --dim:     #2a2f3a;
  --glow:    rgba(255,59,59,0.35);
  --glow2:   rgba(255,204,0,0.25);
  --mono:    'Share Tech Mono', monospace;
  --display: 'Bebas Neue', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

/* Canvas */
#gameCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: block;
}

/* HUD */
#ui-overlay {
  position: fixed;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  padding: 14px 22px;
  pointer-events: none;
  z-index: 10;
}

#score-panel, #best-panel {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
}
#best-panel { align-items: flex-end; }

#score-label, #best-label {
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--accent);
  opacity: 0.7;
}

#score-value, #best-value {
  font-family: var(--display);
  font-size: 36px;
  letter-spacing: 2px;
  color: var(--fg);
  line-height: 1;
  text-shadow: 0 0 18px var(--glow);
}

/* Chaos HUD colours */
body.chaos-warning #score-label,
body.chaos-warning #best-label  { color: #ffaa00; opacity: 0.9; }
body.chaos-warning #score-value,
body.chaos-warning #best-value  { color: #ffcc44; text-shadow: 0 0 24px rgba(255,170,0,0.5); }

body.chaos-active #score-label,
body.chaos-active #best-label   { color: var(--accent); opacity: 1; }
body.chaos-active #score-value,
body.chaos-active #best-value   { color: #ff6060; text-shadow: 0 0 28px rgba(255,0,0,0.7); }

body.chaos-cooldown #score-label,
body.chaos-cooldown #best-label { color: #44ff88; opacity: 0.8; }

/* Screens */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 20;
  background: rgba(8,12,16,0.88);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  backdrop-filter: blur(4px);
}
.screen.active {
  opacity: 1;
  pointer-events: all;
}
.screen-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  text-align: center;
  padding: 20px;
}

/* Start screen */
.logo-block { display: flex; flex-direction: column; align-items: center; gap: 8px; }

.logo-main {
  font-family: var(--display);
  font-size: clamp(72px, 14vw, 130px);
  letter-spacing: 6px;
  color: var(--fg);
  text-shadow: 0 0 30px var(--glow), 0 0 80px var(--glow), 0 2px 0 var(--dim);
  animation: logo-flicker 4s infinite;
}
.logo-accent { color: var(--accent); text-shadow: 0 0 40px var(--glow), 0 0 80px var(--glow); }
.logo-sub {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--accent);
  opacity: 0.7;
}

.start-hint, .restart-hint {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  letter-spacing: 2px;
  color: var(--fg);
  opacity: 0.6;
  animation: pulse-fade 1.8s ease-in-out infinite;
}
.key-icon {
  border: 1.5px solid rgba(232,234,240,0.4);
  padding: 5px 12px;
  font-size: 11px;
  letter-spacing: 2px;
  border-radius: 3px;
  color: var(--fg);
  opacity: 0.8;
}
.warning-text {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--accent);
  opacity: 0.45;
}

/* Death screen */
.dead-title {
  font-family: var(--display);
  font-size: clamp(60px, 12vw, 110px);
  letter-spacing: 8px;
  color: var(--accent);
  text-shadow: 0 0 40px var(--glow), 0 0 100px var(--glow);
  animation: shake-title 0.4s ease;
}
.dead-stats {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 260px;
  border-top: 1px solid var(--dim);
  border-bottom: 1px solid var(--dim);
  padding: 16px 0;
}
.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: 2px;
}
.stat-name { color: var(--fg); opacity: 0.45; }
.stat-val  { color: var(--accent2); text-shadow: 0 0 10px var(--glow2); }
.stat-val.chaos-val { color: #ff6060; text-shadow: 0 0 10px rgba(255,50,50,0.4); }

.taunt-text {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--fg);
  opacity: 0.5;
  max-width: 300px;
  font-style: italic;
}

/* Pause */
.pause-title {
  font-family: var(--display);
  font-size: 72px;
  letter-spacing: 8px;
  color: var(--fg);
  opacity: 0.85;
}

/* Animations */
@keyframes pulse-fade {
  0%, 100% { opacity: 0.6; }
  50%       { opacity: 0.25; }
}
@keyframes logo-flicker {
  0%, 92%, 96%, 100% { opacity: 1; }
  93%, 95%           { opacity: 0.6; }
  94%                { opacity: 0.2; }
}
@keyframes shake-title {
  0%   { transform: translateX(0);  }
  20%  { transform: translateX(-8px); }
  40%  { transform: translateX(8px); }
  60%  { transform: translateX(-5px); }
  80%  { transform: translateX(5px); }
  100% { transform: translateX(0);  }
}

@media (max-width: 480px) {
  #score-value, #best-value { font-size: 26px; }
  .logo-main { font-size: 72px; }
}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
  <div id="score-panel">
    <div id="score-label">DIST</div>
    <div id="score-value">0</div>
  </div>
  <div id="best-panel">
    <div id="best-label">BEST</div>
    <div id="best-value">0</div>
  </div>
</div>

<!-- Start Screen -->
<div id="screen-start" class="screen active">
  <div class="screen-inner">
    <div class="logo-block">
      <div class="logo-main">RUN<span class="logo-accent">Δ</span>X</div>
      <div class="logo-sub">TRUST NOTHING. SURVIVE EVERYTHING.</div>
    </div>
    <div class="start-hint">
      <span class="key-icon">SPACE</span>
      <span>or tap to begin</span>
    </div>
    <div class="warning-text">⚠ The game is watching you ⚠</div>
  </div>
</div>

<!-- Death Screen -->
<div id="screen-dead" class="screen">
  <div class="screen-inner">
    <div class="dead-title">YOU DIED</div>
    <div class="dead-stats">
      <div class="stat-row"><span class="stat-name">DISTANCE</span><span id="dead-score" class="stat-val">0</span></div>
      <div class="stat-row"><span class="stat-name">BEST</span><span id="dead-best" class="stat-val">0</span></div>
      <div class="stat-row"><span class="stat-name">JUMPS</span><span id="dead-jumps" class="stat-val">0</span></div>
      <div class="stat-row"><span class="stat-name">ACCURACY</span><span id="dead-acc" class="stat-val">0%</span></div>
      <div id="chaos-row" class="stat-row" style="display:none;">
        <span class="stat-name">CHAOS SURVIVED</span>
        <span id="dead-chaos" class="stat-val chaos-val">0</span>
      </div>
    </div>
    <div id="taunt-line" class="taunt-text">Try again. Maybe you'll get lucky.</div>
    <div class="restart-hint">
      <span class="key-icon">SPACE</span>
      <span>or tap to retry</span>
    </div>
  </div>
</div>

<!-- Pause Screen -->
<div id="screen-pause" class="screen">
  <div class="screen-inner">
    <div class="pause-title">PAUSED</div>
    <div class="pause-hint">Press P or tap to resume</div>
  </div>
</div>

<script>
// All JS files combined below (engine.js + aiSystem.js + player.js + obstacles.js + game.js)

const Engine = (() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;
  let lastTime = 0, rafId = null, running = false, paused = false;
  let updateFn = null, drawFn = null;
  let shakeAmt = 0, shakeDur = 0, shakeX = 0, shakeY = 0;
  let flashAlpha = 0, flashColor = '#ff3b3b';
  let audioCtx = null;

  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playJump() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'square'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  function playDeath() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }

  function playLand() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    osc.start(); osc.stop(audioCtx.currentTime + 0.06);
  }

  function playChaosWarningSting() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 1.8);
    gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.10, audioCtx.currentTime + 0.3);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);
    osc.start(); osc.stop(audioCtx.currentTime + 2.0);
  }

  function playChaosActiveSting() {
    if (!audioCtx) return;
    [140, 210, 310].forEach((freq, i) => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'square'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.06, audioCtx.currentTime + i * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35 + i * 0.04);
      osc.start(audioCtx.currentTime + i * 0.04);
      osc.stop(audioCtx.currentTime + 0.4 + i * 0.04);
    });
  }

  function playChaosEndSting() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(240, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }

  let _chaosRumbleTimer = 0;
  function tickChaosRumble(dt, intensity) {
    if (!audioCtx || intensity <= 0) return;
    _chaosRumbleTimer -= dt;
    if (_chaosRumbleTimer > 0) return;
    _chaosRumbleTimer = 0.12 + Math.random() * 0.10;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sawtooth'; osc.frequency.value = 40 + Math.random() * 30;
    gain.gain.setValueAtTime(0.02 * intensity, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  }

  let droneOsc = null, droneGain = null;
  function startDrone() {
    if (!audioCtx || droneOsc) return;
    droneOsc = audioCtx.createOscillator(); droneGain = audioCtx.createGain();
    droneOsc.connect(droneGain); droneGain.connect(audioCtx.destination);
    droneOsc.type = 'sine'; droneOsc.frequency.value = 55;
    droneGain.gain.value = 0.03; droneOsc.start();
  }
  function stopDrone() {
    if (!droneOsc) return;
    droneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
    droneOsc.stop(audioCtx.currentTime + 0.5); droneOsc = null;
  }

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function shake(amount = 10, duration = 300) {
    shakeAmt = amount; shakeDur = duration;
  }

  function flash(color = '#ff3b3b', alpha = 0.55) {
    flashColor = color; flashAlpha = alpha;
  }

  function loop(ts) {
    if (!running) return;
    rafId = requestAnimationFrame(loop);

    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;

    if (paused) { render(0); return; }

    if (shakeDur > 0) {
      shakeDur -= dt * 1000;
      const mag = shakeAmt * (shakeDur / 300);
      shakeX = (Math.random() * 2 - 1) * mag;
      shakeY = (Math.random() * 2 - 1) * mag;
    } else { shakeX = 0; shakeY = 0; }

    if (flashAlpha > 0) flashAlpha -= dt * 3;

    if (updateFn) updateFn(dt);
    render(dt);
  }

  function render(dt) {
    ctx.save();
    ctx.translate(shakeX, shakeY);
    ctx.clearRect(-10, -10, W + 20, H + 20);
    if (drawFn) drawFn(ctx, W, H, dt);
    if (flashAlpha > 0) {
      ctx.globalAlpha = Math.max(0, flashAlpha);
      ctx.fillStyle = flashColor;
      ctx.fillRect(-10, -10, W + 20, H + 20);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function start(updateCb, drawCb) {
    updateFn = updateCb; drawFn = drawCb;
    running = true; paused = false;
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    startDrone();
  }

  function stop() {
    running = false; stopDrone();
    if (rafId) cancelAnimationFrame(rafId);
  }

  function setPaused(val) { paused = val; }
  function isPaused() { return paused; }
  function getSize() { return { W, H }; }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    if (id) document.getElementById(id).classList.add('active');
  }

  window.addEventListener('resize', resize);
  resize();

  return {
    canvas, ctx, getSize,
    start, stop, setPaused, isPaused,
    shake, flash, showScreen,
    initAudio, playJump, playDeath, playLand,
    playChaosWarningSting, playChaosActiveSting, playChaosEndSting,
    tickChaosRumble
  };
})();

// ── AISystem (Frustration Engine) ─────────────────────────────────────
const AISystem = (() => {
  const metrics = { jumpsAttempted:0, jumpsSuccessful:0, deaths:0, totalDistance:0, reactionTimes:[], survivalTime:0, consecutiveSaves:0, chaosCompletions:0 };
  const adj = { speedMultiplier:1.0, obstacleTimingBias:0, jumpPhysicsMod:1.0, gravityMod:1.0, unpredictabilityLevel:0 };
  const pattern = { history:[], repeatCount:0, betrayalPending:false, betrayalCooldown:0 };
  const CHAOS_PHASE = { IDLE:0, WARNING:1, ACTIVE:2, COOLDOWN:3 };
  const chaos = { phase:CHAOS_PHASE.IDLE, timer:0, activeDuration:0, cooldownTimer:0, eligibleTimer:0, intensity:0 };

  const taunts = [
    "Try again. Maybe you'll get lucky.", "The pattern was right there.", "Almost. Not quite.",
    "Did you blink?", "Your reflexes are… disappointing.", "That was preventable.",
    "We adjusted. You didn't.", "You were so close it hurts us.", "The game isn't cheating. Promise."
  ];

  function reset() {
    Object.assign(metrics, {jumpsAttempted:0,jumpsSuccessful:0,reactionTimes:[],survivalTime:0,consecutiveSaves:0,chaosCompletions:0});
    Object.assign(adj, {speedMultiplier:1.0,obstacleTimingBias:0,jumpPhysicsMod:1.0,gravityMod:1.0,unpredictabilityLevel:0});
    Object.assign(pattern, {history:[],repeatCount:0,betrayalPending:false,betrayalCooldown:0});
    Object.assign(chaos, {phase:CHAOS_PHASE.IDLE,timer:0,activeDuration:0,cooldownTimer:0,eligibleTimer:0,intensity:0});
  }

  function update(dt) {
    metrics.survivalTime += dt;
    if (pattern.betrayalCooldown > 0) pattern.betrayalCooldown -= dt;
    _adjustSpeed();
    _adjustPhysics();
    _updateUnpredictability();
    _updateChaos(dt);
  }

  function recordJump(obstacleVisibleSince) {
    metrics.jumpsAttempted++;
    if (obstacleVisibleSince > 0) {
      const reaction = performance.now() - obstacleVisibleSince;
      metrics.reactionTimes.push(reaction);
      if (metrics.reactionTimes.length > 20) metrics.reactionTimes.shift();
    }
  }

  function recordSuccess() {
    metrics.jumpsSuccessful++;
    metrics.consecutiveSaves++;
    if (metrics.consecutiveSaves % 4 === 0) pattern.betrayalPending = true;
  }

  function recordDeath(xPos) {
    metrics.deaths++;
    metrics.consecutiveSaves = 0;
    metrics.totalDistance += metrics.survivalTime * 5;
  }

  function recordObstacleSpawn(type, spacing) {
    pattern.history.push({type, spacing});
    if (pattern.history.length > 8) pattern.history.shift();
    if (pattern.history.length >= 2) {
      const last = pattern.history[pattern.history.length-1];
      const prev = pattern.history[pattern.history.length-2];
      if (last.type === prev.type && Math.abs(last.spacing - prev.spacing) < 60) pattern.repeatCount++;
      else pattern.repeatCount = 0;
    }
    if (pattern.repeatCount >= 2 && !pattern.betrayalPending && pattern.betrayalCooldown <= 0) pattern.betrayalPending = true;
  }

  function queryNextObstacle() {
    const cs = getChaosState();
    const tierMul = cs.tier === 'late' ? 3.5 : cs.tier === 'mid' ? 2.5 : 1.5;
    const chaosBoost = cs.isActive ? tierMul : cs.isWarning ? 1.3 : 1.0;

    const result = {betrayal:false, fakeDecoy:false, lastSecTrap:false, speedBurst:false, timingShift:0, chaosPattern:null};

    if (pattern.betrayalPending && pattern.betrayalCooldown <= 0) {
      result.betrayal = true;
      pattern.betrayalPending = false;
      pattern.betrayalCooldown = 6;
      pattern.repeatCount = 0;
    }

    if (Math.random() < (0.05 + adj.unpredictabilityLevel * 0.08) * chaosBoost) result.fakeDecoy = true;
    if (Math.random() < (0.04 + (metrics.survivalTime / 120) * 0.06) * chaosBoost) result.lastSecTrap = true;
    if (metrics.consecutiveSaves > 5 && Math.random() < 0.25 * chaosBoost) result.speedBurst = true;

    if (cs.isActive) {
      const r = Math.random();
      if (cs.tier === 'early') result.chaosPattern = r < 0.6 ? 'wave' : 'trick';
      else if (cs.tier === 'mid') result.chaosPattern = r < 0.4 ? 'wave' : r < 0.75 ? 'trick' : 'gauntlet';
      else result.chaosPattern = r < 0.25 ? 'wave' : r < 0.5 ? 'trick' : 'gauntlet';
    }

    const timingRange = cs.isActive ? (cs.tier === 'late' ? 200 : 150) : 100;
    result.timingShift = adj.obstacleTimingBias + (Math.random() * timingRange - timingRange / 2);

    return result;
  }

  function _chaosTier() {
    const c = metrics.chaosCompletions;
    if (c === 0) return 'early';
    if (c <= 2) return 'mid';
    return 'late';
  }

  function _chaosConditionsMet() {
    return metrics.survivalTime >= 20 && chaos.phase === CHAOS_PHASE.IDLE && getAccuracy() >= 0.75 && metrics.consecutiveSaves >= 3;
  }

  function _updateChaos(dt) {
    switch (chaos.phase) {
      case CHAOS_PHASE.IDLE:
        if (_chaosConditionsMet()) {
          chaos.eligibleTimer += dt;
          if (chaos.eligibleTimer >= 2.0) {
            chaos.phase = CHAOS_PHASE.WARNING;
            chaos.timer = 2.0;
          }
        } else chaos.eligibleTimer = Math.max(0, chaos.eligibleTimer - dt * 0.5);
        chaos.intensity = Math.max(0, chaos.intensity - dt * 1.5);
        break;
      case CHAOS_PHASE.WARNING:
        chaos.timer -= dt;
        chaos.intensity = Math.min(1, 1 - chaos.timer / 2.0);
        if (chaos.timer <= 0) {
          const tier = _chaosTier();
          const minDur = tier === 'late' ? 6 : tier === 'mid' ? 5 : 3;
          const maxDur = tier === 'late' ? 8 : tier === 'mid' ? 6 : 5;
          chaos.activeDuration = minDur + Math.random() * (maxDur - minDur);
          chaos.phase = CHAOS_PHASE.ACTIVE;
          chaos.timer = chaos.activeDuration;
          chaos.intensity = 1;
        }
        break;
      case CHAOS_PHASE.ACTIVE:
        chaos.timer -= dt;
        if (chaos.timer <= 0) {
          chaos.phase = CHAOS_PHASE.COOLDOWN;
          chaos.cooldownTimer = 8.0;
          chaos.timer = chaos.cooldownTimer;
          metrics.chaosCompletions++;
        }
        break;
      case CHAOS_PHASE.COOLDOWN:
        chaos.timer -= dt;
        chaos.intensity = Math.max(0, chaos.timer / chaos.cooldownTimer);
        if (chaos.timer <= 0) {
          chaos.phase = CHAOS_PHASE.IDLE;
          chaos.eligibleTimer = 0;
          chaos.intensity = 0;
        }
        break;
    }
  }

  function getChaosState() {
    return {
      phase: chaos.phase,
      isWarning: chaos.phase === CHAOS_PHASE.WARNING,
      isActive: chaos.phase === CHAOS_PHASE.ACTIVE,
      isCooldown: chaos.phase === CHAOS_PHASE.COOLDOWN,
      intensity: chaos.intensity,
      timer: chaos.timer,
      activeDuration: chaos.activeDuration,
      tier: _chaosTier(),
      completions: metrics.chaosCompletions
    };
  }

  function getPhysicsMods() { return {jumpMod: adj.jumpPhysicsMod, gravityMod: adj.gravityMod}; }
  function getSpeedMultiplier() { return adj.speedMultiplier; }
  function getAccuracy() {
    if (metrics.jumpsAttempted === 0) return 1;
    return metrics.jumpsSuccessful / metrics.jumpsAttempted;
  }
  function getMetrics() { return {...metrics}; }
  function getAdj() { return {...adj}; }
  function getTaunt() { return taunts[Math.floor(Math.random() * taunts.length)]; }

  function _adjustSpeed() {
    const t = metrics.survivalTime;
    const acc = getAccuracy();
    let target = 1.0 + (t / 60) * 0.5 + (t / 120) * 0.3;
    target = Math.min(target, 2.8);
    if (acc > 0.85 && metrics.jumpsSuccessful > 6) target += 0.15;
    if (acc < 0.55 && metrics.jumpsAttempted > 4) target *= 0.92;
    adj.speedMultiplier += (target - adj.speedMultiplier) * 0.005;
  }

  function _adjustPhysics() {
    const t = metrics.survivalTime;
    const drift = Math.sin(t * 0.3) * 0.07 + Math.cos(t * 0.17) * 0.04;
    adj.jumpPhysicsMod = 1.0 + drift;
    adj.gravityMod = 1.0 - drift * 0.5;
    if (t > 45) {
      const extra = (t - 45) / 150;
      adj.jumpPhysicsMod += (Math.random() - 0.5) * extra * 0.12;
      adj.gravityMod += (Math.random() - 0.5) * extra * 0.08;
    }
    adj.jumpPhysicsMod = Math.max(0.88, Math.min(1.14, adj.jumpPhysicsMod));
    adj.gravityMod = Math.max(0.88, Math.min(1.12, adj.gravityMod));
  }

  function _updateUnpredictability() {
    adj.unpredictabilityLevel = Math.min(1, Math.max(0, (metrics.survivalTime - 30) / 80));
  }

  return { reset, update, recordJump, recordSuccess, recordDeath, recordObstacleSpawn, queryNextObstacle,
           getPhysicsMods, getSpeedMultiplier, getAccuracy, getMetrics, getAdj, getTaunt, getChaosState };
})();

// ── Player ───────────────────────────────────────────────────────────
const Player = (() => {
  const BASE_JUMP_VEL = -620, BASE_GRAVITY = 1800, SIZE_W = 26, SIZE_H = 28;
  let x, y, vy, onGround = true, alive = true, groundY = 0;
  let trailPoints = [], deathTimer = 0, landSquash = 1, jumpStretch = 1, tiltAngle = 0;
  let lastObstacleVisibleTs = 0;

  function init(canvasH) {
    groundY = canvasH * 0.72;
    x = canvasH * 0.15; y = groundY; vy = 0;
    onGround = true; alive = true;
    trailPoints = []; deathTimer = 0; landSquash = 1; jumpStretch = 1; tiltAngle = 0;
    lastObstacleVisibleTs = 0;
  }

  function setObstacleVisible(ts) { lastObstacleVisibleTs = ts; }

  function jump() {
    if (!alive || !onGround) return false;
    const mods = AISystem.getPhysicsMods();
    vy = BASE_JUMP_VEL * mods.jumpMod;
    onGround = false; jumpStretch = 0.65;
    AISystem.recordJump(lastObstacleVisibleTs);
    lastObstacleVisibleTs = 0;
    Engine.playJump();
    return true;
  }

  function die() {
    if (!alive) return;
    alive = false; deathTimer = 1.2;
    Engine.playDeath();
    Engine.shake(14, 420);
    Engine.flash('#ff3b3b', 0.6);
    AISystem.recordDeath(x);
  }

  function update(dt) {
    if (!alive) { deathTimer = Math.max(0, deathTimer - dt); return; }

    const mods = AISystem.getPhysicsMods();
    const gravity = BASE_GRAVITY * mods.gravityMod;

    vy += gravity * dt;
    y += vy * dt;

    if (y >= groundY) {
      const wasAirborne = !onGround;
      y = groundY; vy = 0; onGround = true;
      if (wasAirborne) { landSquash = 0.55; Engine.playLand(); }
    } else onGround = false;

    landSquash += (1 - landSquash) * dt * 14;
    jumpStretch += (1 - jumpStretch) * dt * 10;

    const tiltTarget = onGround ? 0 : Math.min(0.35, vy / 2000);
    tiltAngle += (tiltTarget - tiltAngle) * dt * 8;

    trailPoints.unshift({x, y, alpha: 0.6});
    if (trailPoints.length > 14) trailPoints.pop();
    trailPoints.forEach(p => p.alpha -= dt * 2);
  }

  function draw(ctx) {
    if (!alive && deathTimer <= 0) return;
    const alpha = alive ? 1 : Math.min(1, deathTimer / 0.3);

    // Trail
    trailPoints.forEach((p, i) => {
      const ta = Math.max(0, p.alpha) * alpha * 0.5;
      if (ta <= 0) return;
      ctx.save();
      ctx.globalAlpha = ta;
      ctx.fillStyle = '#ff3b3b';
      const scale = 1 - (i / trailPoints.length) * 0.6;
      ctx.fillRect(p.x - SIZE_W * scale * 0.35, p.y - SIZE_H * scale * 0.7, SIZE_W * scale * 0.7, SIZE_H * scale * 0.7);
      ctx.restore();
    });

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    ctx.rotate(tiltAngle);

    const sw = SIZE_W * (onGround ? landSquash : jumpStretch);
    const sh = SIZE_H / (onGround ? landSquash : jumpStretch);

    // Shadow
    ctx.globalAlpha = alpha * 0.25;
    ctx.fillStyle = '#ff3b3b';
    ctx.beginPath();
    ctx.ellipse(0, 4, sw * 0.7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = alpha;

    // Body
    const grad = ctx.createLinearGradient(-sw/2, -sh, sw/2, 0);
    grad.addColorStop(0, '#ff6060');
    grad.addColorStop(1, '#cc1010');
    ctx.fillStyle = grad;
    ctx.shadowColor = '#ff3b3b';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.roundRect(-sw/2, -sh, sw, sh, 4);
    ctx.fill();

    // Eye
    ctx.shadowBlur = 8; ctx.shadowColor = '#fff';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(sw * 0.18, -sh * 0.72, 3.5, 0, Math.PI * 2); ctx.fill();

    // Pupil
    ctx.fillStyle = '#080c10';
    ctx.beginPath(); ctx.arc(sw * 0.22, -sh * 0.70, 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function getBounds() {
    const margin = 4;
    return { x: x - SIZE_W/2 + margin, y: y - SIZE_H, w: SIZE_W - margin*2, h: SIZE_H - 2 };
  }

  return { init, jump, die, update, draw, getBounds, isAlive: () => alive, getPos: () => ({x,y}), isDying: () => !alive && deathTimer > 0, setObstacleVisible, setGroundY: (newGY) => { groundY = newGY; if (onGround) y = groundY; } };
})();

// ── Obstacles ────────────────────────────────────────────────────────
const Obstacles = (() => {
  const TYPES = { SPIKE:'spike', TALL:'tall', DOUBLE:'double', LOW_HANG:'lowHang', DECOY:'decoy' };
  let pool = [], scrollX = 0, nextSpawnX = 0, groundY = 0, canvasW = 0, canvasH = 0;
  let lastType = null, pendingTrap = false;
  let chaosSeqType = null, chaosSeqIndex = 0;
  const CHAOS_SEQ_LEN = 3;

  function init(gY, cW, cH) {
    pool = []; scrollX = 0; groundY = gY; canvasW = cW; canvasH = cH;
    nextSpawnX = cW + 200; lastType = null; pendingTrap = false;
    chaosSeqType = null; chaosSeqIndex = 0;
  }

  function update(dt, speed) {
    const dx = speed * dt;
    scrollX += dx;
    pool.forEach(ob => ob.screenX -= dx);
    pool = pool.filter(ob => ob.screenX + ob.w + 40 > 0);

    while (nextSpawnX - scrollX < canvasW + 400) _spawn();

    if (pendingTrap) { _spawnTrap(); pendingTrap = false; }
  }

  function _spawn() {
    const query = AISystem.queryNextObstacle();
    const speed = AISystem.getSpeedMultiplier();
    const unp = AISystem.getAdj().unpredictabilityLevel;

    let type;
    if (query.betrayal) type = _pickDifferentType(lastType);
    else if (query.fakeDecoy) type = TYPES.DECOY;
    else if (query.chaosPattern) type = _chaosWeightedType(query.chaosPattern, unp);
    else type = _weightedType(unp);

    let baseSpacing = _baseSpacing(type, speed);
    if (query.chaosPattern === 'gauntlet') baseSpacing *= 0.82;
    baseSpacing += query.timingShift * speed * 0.001;
    baseSpacing = Math.max(200, baseSpacing);

    const ob = _makeObstacle(type, nextSpawnX - scrollX, query);
    AISystem.recordObstacleSpawn(type, baseSpacing);
    pool.push(ob);
    nextSpawnX += baseSpacing;
    lastType = type;

    if (query.lastSecTrap) pendingTrap = true;
  }

  function _weightedType(unp) {
    const r = Math.random();
    if (r < 0.35 - unp*0.1) return TYPES.SPIKE;
    if (r < 0.52 - unp*0.05) return TYPES.DOUBLE;
    if (r < 0.66 + unp*0.08) return TYPES.TALL;
    if (r < 0.78 + unp*0.10) return TYPES.LOW_HANG;
    return TYPES.SPIKE;
  }

  function _chaosWeightedType(patternHint, unp) {
    if (chaosSeqType !== patternHint || chaosSeqIndex >= CHAOS_SEQ_LEN) {
      chaosSeqType = patternHint; chaosSeqIndex = 0;
    }
    const pos = chaosSeqIndex++;
    switch (patternHint) {
      case 'wave': return pos === 1 ? TYPES.DOUBLE : TYPES.SPIKE;
      case 'trick': return pos === 0 ? TYPES.DECOY : pos === 1 ? TYPES.SPIKE : TYPES.TALL;
      case 'gauntlet': return pos === 0 ? TYPES.TALL : TYPES.DOUBLE;
      default: return _weightedType(unp);
    }
  }

  function _pickDifferentType(current) {
    const options = Object.values(TYPES).filter(t => t !== current && t !== TYPES.DECOY);
    return options[Math.floor(Math.random() * options.length)];
  }

  function _baseSpacing(type, speed) {
    const slow = 320 / speed, mid = 420 / speed, far = 560 / speed;
    switch (type) {
      case TYPES.DOUBLE: return slow * 1.1;
      case TYPES.LOW_HANG: return mid * 1.2;
      case TYPES.TALL: return mid;
      default: return slow + Math.random() * (far - slow);
    }
  }

  function _makeObstacle(type, screenX, query) {
    const isSafe = type === TYPES.DECOY;
    const base = { type, screenX, safe: isSafe, visible: true, visibleTs: 0, cleared: false };

    switch (type) {
      case TYPES.SPIKE: return {...base, x:screenX, y:groundY, w:28, h:44, shape:'spike', color:'#ff3b3b', glowColor:'#ff3b3b'};
      case TYPES.TALL: return {...base, x:screenX, y:groundY-20, w:22, h:64, shape:'rect', color:'#ff6b00', glowColor:'#ff6b00'};
      case TYPES.DOUBLE: {
        const ob1 = _makeObstacle(TYPES.SPIKE, screenX, query);
        ob1.twinX = screenX + 44; ob1.isDouble = true;
        return ob1;
      }
      case TYPES.LOW_HANG: return {...base, x:screenX, y:groundY-90, w:60, h:18, shape:'hang', color:'#cc00ff', glowColor:'#cc00ff', isCeiling:true};
      case TYPES.DECOY: return {...base, x:screenX, y:groundY, w:28, h:44, shape:'spike', color:'#2a7a3b', glowColor:'#00ff88', safe:true};
      default: return {...base, x:screenX, y:groundY, w:28, h:44, shape:'spike', color:'#ff3b3b', glowColor:'#ff3b3b'};
    }
  }

  function _spawnTrap() {
    const playerX = Player.getPos().x;
    const trapX = playerX + 80 + Math.random() * 40;
    pool.push({
      type: TYPES.SPIKE, shape:'spike',
      screenX: trapX, x: trapX, y: groundY,
      w:20, h:36, color:'#ff3b3b', glowColor:'#ff3b3b',
      safe:false, visible:true, visibleTs:performance.now(), cleared:false, isTrap:true
    });
  }

  function checkCollision(playerBounds) {
    for (const ob of pool) {
      if (ob.cleared || ob.safe) continue;

      if (!ob.visibleTs && ob.screenX < canvasW + 50) {
        ob.visibleTs = performance.now();
        Player.setObstacleVisible(ob.visibleTs);
      }

      if (ob.isCeiling) {
        if (_rectOverlap(playerBounds, {x:ob.screenX, y:ob.y-ob.h, w:ob.w, h:ob.h})) return ob;
        continue;
      }

      const obBounds = {x:ob.screenX, y:ob.y-ob.h, w:ob.w, h:ob.h};
      if (_rectOverlap(playerBounds, obBounds)) return ob;

      if (ob.isDouble) {
        const ob2 = {x:ob.twinX, y:ob.y-ob.h, w:ob.w, h:ob.h};
        if (_rectOverlap(playerBounds, ob2)) return ob;
      }

      if (ob.screenX + ob.w < playerBounds.x && !ob.cleared) {
        ob.cleared = true;
        AISystem.recordSuccess();
      }
    }
    return null;
  }

  function _rectOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function draw(ctx) {
    pool.forEach(ob => _drawObstacle(ctx, ob));
  }

  function _drawObstacle(ctx, ob) {
    if (!ob.visible) return;
    ctx.save();
    ctx.shadowColor = ob.glowColor;
    ctx.shadowBlur = 16;

    if (ob.shape === 'spike') {
      _drawSpike(ctx, ob.screenX, ob.y, ob.w, ob.h, ob.color);
      if (ob.isDouble) _drawSpike(ctx, ob.twinX, ob.y, ob.w, ob.h, ob.color);
    } else if (ob.shape === 'rect') {
      ctx.fillStyle = ob.color;
      ctx.fillRect(ob.screenX, ob.y - ob.h, ob.w, ob.h);
    } else if (ob.shape === 'hang') {
      ctx.fillStyle = ob.color;
      ctx.fillRect(ob.screenX, ob.y - ob.h, ob.w, ob.h);
    }

    ctx.restore();
  }

  function _drawSpike(ctx, sx, sy, w, h, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + w, sy);
    ctx.lineTo(sx + w/2, sy - h);
    ctx.closePath();
    ctx.fill();
  }

  function setGroundY(newGY) { groundY = newGY; }

  return { init, update, draw, checkCollision, setGroundY };
})();

// ── Main Game Logic ──────────────────────────────────────────────────
(function () {
  const STATE = { MENU:0, PLAYING:1, DEAD:2, PAUSED:3 };
  let state = STATE.MENU;

  let highScore = parseInt(localStorage.getItem('runax_best') || '0', 10);
  let score = 0, bestScore = highScore;

  let groundY = 0;
  let worldScrollX = 0;

  const elScore = document.getElementById('score-value');
  const elBest = document.getElementById('best-value');
  const elDeadScore = document.getElementById('dead-score');
  const elDeadBest = document.getElementById('dead-best');
  const elDeadJumps = document.getElementById('dead-jumps');
  const elDeadAcc = document.getElementById('dead-acc');
  const elTaunt = document.getElementById('taunt-line');
  const elChaosRow = document.getElementById('chaos-row');
  const elDeadChaos = document.getElementById('dead-chaos');

  let prevChaosPhase = -1;
  let glitchLines = [];

  function _setChaosClass(cs) {
    document.body.classList.remove('chaos-warning', 'chaos-active', 'chaos-cooldown');
    if (cs.isWarning) document.body.classList.add('chaos-warning');
    if (cs.isActive) document.body.classList.add('chaos-active');
    if (cs.isCooldown) document.body.classList.add('chaos-cooldown');
  }

  // Road System (visual only)
  const RoadSystem = (() => {
    let vertOffset = 0, vertTarget = 0, bendAngle = 0, bendTarget = 0, narrowFactor = 1.0, narrowTarget = 1.0;
    let phaseV = 0, phaseH = 0, time = 0;

    function reset() {
      vertOffset = vertTarget = bendAngle = bendTarget = 0;
      narrowFactor = narrowTarget = 1.0;
      phaseV = phaseH = time = 0;
    }

    function update(dt, cs) {
      time += dt;
      const amp = cs.intensity;
      const tierMul = cs.tier === 'late' ? 1.0 : cs.tier === 'mid' ? 0.65 : 0.35;
      const warpScale = amp * tierMul;

      phaseV += dt * (cs.isActive ? (cs.tier === 'late' ? 0.55 : 0.4) : 0.25) * Math.PI * 2;
      phaseH += dt * (cs.isActive ? (cs.tier === 'late' ? 0.35 : 0.25) : 0.15) * Math.PI * 2;

      const maxVert = 38 * warpScale;
      const maxBend = 0.06 * warpScale;
      const minNarrow = 1.0 - 0.45 * warpScale;

      vertTarget = Math.sin(phaseV) * maxVert;
      bendTarget = Math.sin(phaseH) * maxBend;
      narrowTarget = minNarrow + (1.0 - minNarrow) * (0.5 + 0.5 * Math.cos(phaseV * 0.7));

      if (warpScale < 0.01) { vertTarget = 0; bendTarget = 0; narrowTarget = 1.0; }

      const lerpRate = 2.8;
      vertOffset += (vertTarget - vertOffset) * Math.min(1, dt * lerpRate);
      bendAngle += (bendTarget - bendAngle) * Math.min(1, dt * lerpRate * 0.7);
      narrowFactor += (narrowTarget - narrowFactor) * Math.min(1, dt * lerpRate * 1.2);
    }

    function draw(ctx, W, H, gY, cs) {
      if (cs.intensity < 0.02) return;
      const roadCY = gY + vertOffset;
      const bandH = 16 + narrowFactor * 8;

      ctx.save();
      ctx.globalAlpha = Math.min(0.85, cs.intensity * 0.9);
      const roadCol = cs.isActive ? 'rgba(60,0,0,' : 'rgba(40,20,0,';
      const rGrad = ctx.createLinearGradient(0, roadCY - bandH, 0, roadCY + 6);
      rGrad.addColorStop(0, roadCol + '0)');
      rGrad.addColorStop(0.5, roadCol + '0.5)');
      rGrad.addColorStop(1, roadCol + '0)');
      ctx.fillStyle = rGrad;
      ctx.fillRect(0, roadCY - bandH, W, bandH + 6);
      ctx.restore();
    }

    return { reset, update, draw };
  })();

  function init() {
    const { W, H } = Engine.getSize();
    groundY = H * 0.72;
    Player.init(H);
    Obstacles.init(groundY, W, H);
    AISystem.reset();
    RoadSystem.reset();
    score = 0; worldScrollX = 0;
    Engine.showScreen('screen-start');
    elBest.textContent = bestScore;
  }

  function startGame() {
    const { W, H } = Engine.getSize();
    Engine.initAudio();
    groundY = H * 0.72;
    Player.init(H);
    Obstacles.init(groundY, W, H);
    AISystem.reset();
    RoadSystem.reset();
    score = 0; worldScrollX = 0;
    prevChaosPhase = -1;
    glitchLines = [];
    state = STATE.PLAYING;
    Engine.showScreen(null);
    Engine.start(update, draw);
  }

  function gameOver() {
    state = STATE.DEAD;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('runax_best', String(bestScore));
    }
    const m = AISystem.getMetrics();
    const acc = Math.round(AISystem.getAccuracy() * 100);
    elDeadScore.textContent = score;
    elDeadBest.textContent = bestScore;
    elDeadJumps.textContent = m.jumpsAttempted;
    elDeadAcc.textContent = acc + '%';
    elTaunt.textContent = AISystem.getTaunt();

    if (m.chaosCompletions > 0) {
      elDeadChaos.textContent = m.chaosCompletions;
      elChaosRow.style.display = 'flex';
    } else elChaosRow.style.display = 'none';

    elBest.textContent = bestScore;
    _setChaosClass({isWarning:false, isActive:false, isCooldown:false});

    setTimeout(() => {
      if (state === STATE.DEAD) Engine.showScreen('screen-dead');
    }, 600);
  }

  function restartGame() {
    Engine.stop();
    startGame();
  }

  function togglePause() {
    if (state === STATE.PLAYING) {
      state = STATE.PAUSED;
      Engine.setPaused(true);
      Engine.showScreen('screen-pause');
    } else if (state === STATE.PAUSED) {
      state = STATE.PLAYING;
      Engine.setPaused(false);
      Engine.showScreen(null);
    }
  }

  function update(dt) {
    if (state !== STATE.PLAYING) return;

    const speed = 280 * AISystem.getSpeedMultiplier();
    worldScrollX += speed * dt;

    AISystem.update(dt);
    Player.update(dt);
    Obstacles.update(dt, speed);

    const cs = AISystem.getChaosState();

    if (cs.phase !== prevChaosPhase) {
      if (cs.isWarning) { Engine.playChaosWarningSting(); Engine.shake(1.5, 99999); }
      if (cs.isActive) { Engine.playChaosActiveSting(); Engine.flash('#3b1a1a', 0.4); }
      if (cs.isCooldown) { Engine.playChaosEndSting(); Engine.flash('#1a3b1a', 0.3); }
      prevChaosPhase = cs.phase;
    }

    if (cs.isWarning || cs.isActive) {
      Engine.tickChaosRumble(dt, cs.intensity);
      Engine.shake(cs.isActive ? 3.5 : 1.2 * cs.intensity, 80);
    }

    RoadSystem.update(dt, cs);

    if (cs.isWarning || cs.isActive) {
      // simple glitch simulation
      if (Math.random() < cs.intensity * 3) {
        glitchLines.push({life: 0.1});
      }
    } else glitchLines = [];

    _setChaosClass(cs);

    score = Math.floor(worldScrollX / 40);
    elScore.textContent = score;
    elBest.textContent = bestScore;

    if (Player.isAlive()) {
      const hit = Obstacles.checkCollision(Player.getBounds());
      if (hit) {
        Player.die();
        setTimeout(gameOver, 300);
      }
    }
  }

  function draw(ctx, W, H) {
    const cs = AISystem.getChaosState();

    // Background
    const darken = cs.intensity * 0.85;
    ctx.fillStyle = `rgb(${Math.round(4+darken*4)},${Math.round(6+darken*6)},${Math.round(9+darken*9)})`;
    ctx.fillRect(0, 0, W, H);

    // Simple ground
    ctx.strokeStyle = cs.isActive ? '#ff8800' : cs.isWarning ? '#cc6600' : '#ff3b3b';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 8;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.beginPath();
    ctx.moveTo(0, groundY);
    ctx.lineTo(W, groundY);
    ctx.stroke();
    ctx.shadowBlur = 0;

    RoadSystem.draw(ctx, W, H, groundY, cs);

    Obstacles.draw(ctx);
    Player.draw(ctx);

    // Simple vignette
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Chaos flash overlay
    if (cs.intensity > 0.1) {
      ctx.globalAlpha = cs.intensity * 0.15;
      ctx.fillStyle = cs.isActive ? '#330000' : '#332200';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  // Input
  function handleJumpInput() {
    Engine.initAudio();
    if (state === STATE.MENU) { startGame(); }
    else if (state === STATE.DEAD) { restartGame(); }
    else if (state === STATE.PAUSED) { togglePause(); }
    else if (state === STATE.PLAYING) { Player.jump(); }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleJumpInput();
    }
    if (e.code === 'KeyP' && (state === STATE.PLAYING || state === STATE.PAUSED)) {
      togglePause();
    }
  });

  document.addEventListener('touchstart', e => {
    e.preventDefault();
    handleJumpInput();
  }, { passive: false });

  window.addEventListener('resize', () => {
    if (state === STATE.PLAYING || state === STATE.PAUSED) {
      const { W, H } = Engine.getSize();
      groundY = H * 0.72;
      Player.setGroundY(groundY);
      Obstacles.setGroundY(groundY);
    }
  });

  // Boot the game
  init();
})();
</script>
</body>
</html>
